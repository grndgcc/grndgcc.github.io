<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2:3 Resim Kesici</title>
    <!-- Cropper.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .upload-section {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input[type="text"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .img-container {
            max-height: 500px;
            margin-bottom: 20px;
            background-color: #eee;
            overflow: hidden;
        }
        img {
            max-width: 100%;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-save {
            background-color: #28a745;
            display: none;
        }
        .btn-save:hover {
            background-color: #218838;
        }
        h1 { color: #333; }
        p { color: #666; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>2:3 Resim Boyutlandırıcı</h1>
    <p>Resmi yükleyin, alanı belirleyin ve indirin.</p>

    <div class="upload-section">
        <!-- Dosyadan Yükle -->
        <input type="file" id="fileInput" accept="image/*">
        
        <!-- URL'den Yükle -->
        <div style="display:flex; gap:5px;">
            <input type="text" id="urlInput" placeholder="Resim URL'si yapıştırın..." style="flex:1;">
            <button class="btn" onclick="loadImageFromUrl()">Yükle</button>
        </div>
    </div>

    <div class="img-container">
        <img id="image" src="" alt="">
    </div>

    <button id="cropBtn" class="btn btn-save">Resmi Kes ve İndir</button>
</div>

<!-- Cropper.js JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

<script>
    let cropper;
    const image = document.getElementById('image');
    const fileInput = document.getElementById('fileInput');
    const urlInput = document.getElementById('urlInput');
    const cropBtn = document.getElementById('cropBtn');

    // Dosya seçildiğinde tetiklenir
    fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files && files.length > 0) {
            const reader = new FileReader();
            reader.onload = (event) => {
                initCropper(event.target.result);
            };
            reader.readAsDataURL(files[0]);
        }
    });

    // URL'den resim yükleme fonksiyonu
    function loadImageFromUrl() {
        const url = urlInput.value;
        if (url) {
            // CORS problemlerini önlemek için bazı resimler yüklenmeyebilir
            initCropper(url);
        }
    }

    // Cropper'ı başlatan fonksiyon
    function initCropper(src) {
        if (cropper) {
            cropper.destroy(); // Eski cropper'ı temizle
        }
        image.src = src;
        cropBtn.style.display = 'inline-block';

        cropper = new Cropper(image, {
            aspectRatio: 2 / 3, // 2:3 Oranı
            viewMode: 1,
            autoCropArea: 1,
            responsive: true,
        });
    }

    // Kesme ve Kaydetme işlemi
    cropBtn.addEventListener('click', () => {
        const canvas = cropper.getCroppedCanvas({
            width: 800, // Çıktı genişliği (oran korunur)
            height: 1200, // Çıktı yüksekliği
            imageSmoothingEnabled: true,
            imageSmoothingQuality: 'high',
        });

        // Resmi indir
        const link = document.createElement('a');
        link.download = 'kesilmis-resim-2-3.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
