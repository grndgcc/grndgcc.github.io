<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İkili Evren - Online VTT</title>
    
    <!-- Fontlar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <style>
        :root {
            --bg-color: #0b0c10;
            --glass-bg: rgba(15, 15, 20, 0.95);
            --glass-border: rgba(197, 160, 89, 0.4);
            --gold-text: #c5a059;
            --text-main: #e0e0e0;
            --accent-red: #8e2525;
            --accent-green: #2e5a38;
            --blur-amt: 12px;
        }

        * { box-sizing: border-box; touch-action: none; }

        body {
            margin: 0; padding: 0; font-family: 'Lato', sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            overflow: hidden; display: flex; height: 100vh; width: 100vw;
            background-image: radial-gradient(circle at center, #1f2833 0%, #000000 100%);
        }

        h1, h2, h3, h4, button { font-family: 'Cinzel', serif; }

        /* UI */
        .glass-panel {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 6px; box-shadow: 0 4px 30px rgba(0,0,0,0.8);
            color: var(--text-main); pointer-events: auto;
        }

        button {
            background: linear-gradient(180deg, rgba(50,50,50,0.9) 0%, rgba(20,20,20,1) 100%);
            border: 1px solid var(--glass-border); color: var(--gold-text);
            padding: 8px 10px; border-radius: 4px; cursor: pointer;
            font-weight: bold; font-size: 0.75rem; transition: 0.2s;
        }
        button:hover { background: rgba(197,160,89,0.15); border-color: #fff; }
        button:active { transform: scale(0.96); }
        button.active { background: var(--accent-red); color: white; border-color: white; }
        button:disabled { opacity: 0.5; cursor: wait; }

        input, select, textarea {
            background: rgba(0,0,0,0.5); color: white; border: 1px solid #444;
            padding: 8px; border-radius: 3px; width: 100%; font-family: 'Lato', sans-serif; text-align: center;
        }
        input:focus { outline: none; border-color: var(--gold-text); }

        /* LOADING */
        #loading-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.9); z-index: 10000; display: none;
            justify-content: center; align-items: center; flex-direction: column; color: var(--gold-text);
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--gold-text);
            border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* DOCK */
        #ui-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; padding: 10px 20px; z-index: 2000;
            border-radius: 30px; border: 1px solid var(--gold-text); background: rgba(0,0,0,0.95);
        }
        .dock-btn {
            width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; border: 1px solid #555; background: #222;
        }
        .dock-btn.active-mode { border-color: var(--gold-text); background: var(--accent-red); }

        /* PANELS */
        #sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 340px; z-index: 1500;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            transform: translateX(-360px); transition: transform 0.3s ease;
        }
        #sidebar.open { transform: translateX(0); }
        
        .float-panel {
            position: fixed; z-index: 500; padding: 10px; display: none; flex-direction: column;
            min-width: 240px; max-width: 320px; max-height: 80vh;
        }
        .float-panel.visible { display: flex; }
        .float-header { 
            font-family: 'Cinzel', serif; font-weight: bold; color: var(--gold-text); 
            border-bottom: 1px solid #555; padding-bottom: 5px; margin-bottom: 5px; 
            display: flex; justify-content: space-between; cursor: move; 
        }

        #panel-initiative { top: 70px; right: 20px; }
        #panel-activity { top: 70px; left: 360px; }
        #panel-inspiration { top: 20px; right: 280px; width: 180px; text-align: center; }
        #panel-log { bottom: 100px; right: 20px; width: 320px; height: 300px; }
        #panel-chat { bottom: 100px; left: 20px; width: 300px; height: 350px; }
        #panel-journal { top: 100px; left: 50%; transform: translateX(-50%); width: 400px; height: 500px; }

        .list-container { flex-grow: 1; overflow-y: auto; font-size: 0.9rem; scrollbar-width: thin; }
        .list-item { display: flex; justify-content: space-between; padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .list-item.active { background: rgba(197, 160, 89, 0.2); border-left: 2px solid var(--gold-text); }

        .control-group { background: rgba(255,255,255,0.03); padding: 10px; border: 1px solid #333; border-radius: 4px; }

        /* GAME AREA */
        #game-area { position: absolute; top:0; left:0; width:100%; height:100%; overflow: hidden; cursor: default; z-index: 0; }
        #map-container { position: absolute; top:0; left:0; transform-origin: 0 0; }
        #game-map { position: absolute; z-index: 1; pointer-events: none; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        #grid-canvas { z-index: 2; }
        #fog-canvas { z-index: 3; }
        #ruler-canvas { z-index: 20; }
        #weather-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
        .ruler-active { cursor: crosshair !important; }

        /* TOKENS */
        .token {
            position: absolute; z-index: 10; border-radius: 50%;
            border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.8);
            background-size: cover; background-position: center; transition: border-color 0.2s;
        }
        .token.my-token { border-color: var(--accent-green); cursor: grab; }
        .token.other-token { border-color: var(--accent-red); }
        .token.locked-token { cursor: not-allowed; border-style: dashed; }
        .token:active { cursor: grabbing; }
        
        .token-name {
            position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); padding: 2px 5px; border-radius: 4px;
            font-size: 12px; white-space: nowrap; pointer-events: none; color: white;
            font-weight: bold; border: 1px solid #555; z-index: 20;
        }
        .token-statuses {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 2px; pointer-events: none; white-space: nowrap; z-index: 15;
        }
        .status-badge {
            background: rgba(0,0,0,0.8); color: #f1c40f; padding: 2px 4px; 
            border-radius: 3px; font-size: 9px; border: 1px solid #555;
        }
        .token.is-dead::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><line x1="10" y1="10" x2="90" y2="90" stroke="red" stroke-width="15" /><line x1="90" y1="10" x2="10" y2="90" stroke="red" stroke-width="15" /></svg>');
            background-size: contain; opacity: 0.8; pointer-events: none;
        }
        .token-tooltip {
            position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
            background: var(--glass-bg); border: 1px solid var(--gold-text);
            padding: 10px; border-radius: 5px; width: 220px; pointer-events: none;
            display: none; z-index: 100; text-align: left; font-size: 0.8rem;
            box-shadow: 0 5px 15px black;
        }
        .token:hover .token-tooltip { display: block; }
        .tt-header { font-weight: bold; color: var(--gold-text); border-bottom: 1px solid #555; margin-bottom: 5px; }
        .tt-row { display: flex; justify-content: space-between; font-size: 0.75rem; }
        .token-gear {
            position: absolute; bottom: 0; right: 0; width: 24px; height: 24px;
            background: var(--gold-text); color: black; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 14px;
            cursor: pointer; z-index: 25; border: 1px solid black;
        }

        /* SHEET & LOG */
        #char-sheet-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 800px; max-width: 95%; height: 750px; max-height: 95%; z-index: 5000;
            padding: 0; flex-direction: column;
        }
        .gm-controls-area {
            background: rgba(142, 37, 37, 0.15); border-bottom: 1px solid var(--accent-red);
            padding: 10px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: center;
        }
        .sheet-body { padding: 20px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex-grow:1; }
        .stat-row { 
            display: grid; grid-template-columns: 100px 1fr 1fr; gap: 5px; align-items: center;
            margin-bottom: 5px; padding: 4px; background: rgba(255,255,255,0.03); border-radius: 4px;
        }
        .stat-btn-locked { grid-column: 1 / span 3; text-align: left; width: 100%; background: transparent; color:white; border:none; padding:10px; display:none; }
        .locked-mode .input-group { display: none; }
        .locked-mode .stat-btn-locked { display: block; }
        .locked-mode .stat-btn-locked.selected { background: var(--gold-text); color: black; }
        .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 5px; }
        .status-btn { font-size: 0.65rem; padding: 4px; background: #333; border: 1px solid #555; color: #aaa; }
        .status-btn.active-status { background: var(--accent-red); color: white; border-color: white; }

        .log-entry { margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; font-size: 0.85rem; }
        .log-actions { margin-top: 5px; display: flex; gap: 5px; flex-wrap: wrap; }
        .chat-msg { margin-bottom: 5px; word-wrap: break-word; font-size:0.9rem;}
        .chat-msg b { color: var(--gold-text); }
        .chat-gif { max-width: 100%; border-radius: 4px; margin-top:5px;}

        /* MOBILE */
        @media (max-width: 768px) {
            #ui-dock { width: 95%; justify-content: space-between; padding: 8px; bottom: 10px; }
            #sidebar { width: 100%; }
            .float-panel { width: 90% !important; left: 5% !important; right: 5% !important; top: 60px !important; max-height: 40vh; }
            #panel-log, #panel-chat { bottom: 70px !important; top: auto !important; height: 250px !important; }
            #panel-journal { width: 95%; height: 60%; top: 10%; left: 2.5%; transform: none; }
            .sheet-body { grid-template-columns: 1fr; }
            .gm-controls-area { grid-template-columns: 1fr; }
            #inspiration-box { width: 100% !important; position: relative; left:0; top:0; }
            .status-grid { grid-template-columns: repeat(3, 1fr); }
        }
        .gm-only { display: none; }
    </style>
</head>
<body>

    <div id="loading-overlay"><div class="spinner"></div><div>Bağlanıyor / Yükleniyor...</div></div>

    <!-- GİRİŞ -->
    <div id="login-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;justify-content:center;align-items:center;">
        <div class="glass-panel" style="padding:40px; text-align:center; width:300px; border:2px solid var(--gold-text);">
            <h1 style="color:var(--gold-text);">İKİLİ EVREN</h1>
            <p style="color:#aaa; font-size:0.7rem; margin-bottom:20px;">ONLINE</p>
            
            <input type="text" id="room-input" placeholder="Oda Adı (Örn: oyun1)" style="margin-bottom:10px;">
            <small style="color:#777; display:block; margin-bottom:10px;">İlk kez giriyorsanız yeni oda oluşturulur.</small>
            
            <select id="role-select" style="margin-bottom:10px;">
                <option value="gm1">GM (Yönetici)</option>
                <option value="player1">Oyuncu 1</option>
                <option value="player2">Oyuncu 2</option>
                <option value="player3">Oyuncu 3</option>

            <input type="password" id="password-input" placeholder="Şifre" style="margin-bottom:15px;">
            <button onclick="attemptLogin()" style="width:100%;">GİRİŞ</button>
            <p id="login-msg" style="color:var(--accent-red); margin-top:10px; font-size:0.8rem;"></p>
        </div>
    </div>

    <!-- UI -->
    <div id="weather-overlay"></div>
    <div id="ruler-info" style="position:fixed; top:80px; left:50%; transform:translateX(-50%); background:black; border:1px solid var(--gold-text); padding:5px 15px; border-radius:20px; display:none; z-index:2000; pointer-events:none;">0m</div>

    <!-- DOCK -->
    <div id="ui-dock" class="glass-panel">
        <button class="dock-btn" onclick="toggleSidebar()">⚙️</button>
        <button class="dock-btn" onclick="togglePanel('panel-initiative')">⚔️</button>
        <button class="dock-btn" onclick="togglePanel('panel-activity')">🎤</button>
        <button class="dock-btn" onclick="togglePanel('panel-inspiration')">✨</button>
        <button class="dock-btn" id="btn-ruler" onclick="toggleRuler()">📏</button>
        <button class="dock-btn" onclick="togglePanel('panel-journal')">📖</button>
        <button class="dock-btn" onclick="togglePanel('panel-chat')">💬</button>
        <button class="dock-btn" onclick="togglePanel('panel-log')">📜</button>

    <!-- SIDEBAR -->
    <div id="sidebar" class="glass-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #444; padding-bottom:10px;">

        </div>
        <div class="control-group gm-only">
            <span>HARİTA</span> <input type="file" id="map-upload" accept="image/*">
            <div style="margin-top:5px;display:flex;gap:5px;">
                <input type="number" id="grid-size" value="50" onchange="updateGrid()" placeholder="px">
                <input type="number" id="grid-scale" value="1.5" step="0.5" onchange="updateGrid()" placeholder="m">
            </div>
            <label style="font-size:0.8rem;display:block;margin-top:5px;"><input type="checkbox" id="grid-show" onchange="updateGrid()" checked style="width:auto;"> Grid</label>
        </div>
        <div class="control-group"><span>TOKEN</span> <input type="file" id="token-upload" accept="image/*"></div>

    <div id="panel-journal" class="glass-panel float-panel"><div class="float-header">ÖZEL GÜNLÜK <button onclick="togglePanel('panel-journal')">X</button></div><textarea id="journal-text" style="flex-grow:1; background:rgba(0,0,0,0.3); color:#ddd; font-family:'Lato'; padding:10px; border:none; resize:none;" placeholder="Notlarınız (Sadece siz görürsünüz)..."></textarea></div>

            <button onclick="rollStats()" style="width:100%; padding:15px; font-size:1.2rem; background:var(--gold-text); color:black;">ZAR AT</button>
        </div>

        // --- GİRİŞ ---
        async function attemptLogin() {
            const room = document.getElementById('room-input').value.trim();
            const role = document.getElementById('role-select').value;
            const pass = document.getElementById('password-input').value;
            if(!room) { alert("Oda adı girin."); return; }
            
            showLoading(true);
            try {
                const ref = db.collection('rooms').doc(room);
                const doc = await ref.get();
                if(!doc.exists) {
                    if(pass !== CREDENTIALS[role]) throw new Error("Yeni oda için varsayılan şifreleri kullanın.");
                    await ref.set({ users:CREDENTIALS, mapSrc:null, grid:{show:true,size:50,scale:1.5}, weather:"", initiative:{list:[],round:1,currentIdx:0}, activity:{paused:false,scores:{},speaking:null}, inspiration:{}, chat:[], tokens:[] });
                } else {
                    if(doc.data().users && doc.data().users[role] !== pass) throw new Error("Hatalı Şifre");
                }
                
                currentRoom=room; currentUser=role; isGM=role.startsWith('gm');
                document.getElementById('login-screen').style.display='none';
                document.getElementById('user-display').innerText=role.toUpperCase();
                if(isGM) document.querySelectorAll('.gm-only').forEach(e=>e.style.display='block');
                
                const saved = localStorage.getItem('vtt_journal_'+currentUser+'_'+currentRoom);
                if(saved) document.getElementById('journal-text').value = saved;
                
                const opts = `<option value="">Özellik...</option>` + TRAITS.map(t=>`<option>${t}</option>`).join('');
                document.querySelectorAll('.trait-select').forEach(s=>s.innerHTML=opts);

                ref.onSnapshot(snap => { if(snap.exists) { gameState=snap.data(); renderAll(); } });
                initZoomPan(); initMic();
            } catch(e) { alert(e.message); } finally { showLoading(false); }
        }

            if(!file)return null; showLoading(true);
            try { const ref=storage.ref().child(`rooms/${currentRoom}/${Date.now()}_${file.name}`); await ref.put(file); showLoading(false); return await ref.getDownloadURL(); }
            catch(e){ showLoading(false); alert("Yükleme hatası: "+e.message); return null; }
        }

        function renderMap() {
            const m = document.getElementById('game-map');

        // --- ZOOM & PAN & DRAG ---
        function initZoomPan() {
            const area=document.getElementById('game-area'), cont=document.getElementById('map-container');
            let isPanning=false, startX=0, startY=0;
            function apply() { cont.style.transform = `translate(${mapTransform.x}px, ${mapTransform.y}px) scale(${mapTransform.scale})`; }

            area.addEventListener('wheel', e => {
                e.preventDefault(); const delta = e.deltaY>0?0.9:1.1;
                const newScale = Math.min(Math.max(0.1, mapTransform.scale*delta), 5);
                const rect=area.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top;
                mapTransform.x = mx - (mx - mapTransform.x)*(newScale/mapTransform.scale);
                mapTransform.y = my - (my - mapTransform.y)*(newScale/mapTransform.scale);
                mapTransform.scale = newScale; apply();
            }, {passive:false});

            area.addEventListener('contextmenu',e=>e.preventDefault());
            area.addEventListener('mousedown',e=>{if(e.button===2){isPanning=true;startX=e.clientX-mapTransform.x;startY=e.clientY-mapTransform.y;area.style.cursor='grabbing';}});
            window.addEventListener('mousemove',e=>{if(isPanning){e.preventDefault();mapTransform.x=e.clientX-startX;mapTransform.y=e.clientY-startY;apply();}});
            window.addEventListener('mouseup',()=>{isPanning=false;area.style.cursor='default';});

            // Mobile Pinch
            let initDist=0, initScale=1;
            area.addEventListener('touchstart',e=>{if(e.touches.length===2){initDist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);initScale=mapTransform.scale;}},{passive:false});
            area.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);const delta=dist/initDist;mapTransform.scale=Math.min(Math.max(0.1,initScale*delta),5);apply();}},{passive:false});
        }

        function addDrag(el,id) {
            let start=null, initPos=null; const img=document.getElementById('game-map');
            const startD=(x,y)=>{if(rulerMode)return false;start={x,y};initPos={left:parseInt(el.style.left||0),top:parseInt(el.style.top||0)};return true;}
            const moveD=(x,y)=>{
                if(!start)return;
                let nx=initPos.left+(x-start.x)/mapTransform.scale, ny=initPos.top+(y-start.y)/mapTransform.scale;
                const w=img.naturalWidth||800, h=img.naturalHeight||600;
                nx=Math.max(0,Math.min(nx,w-70)); ny=Math.max(0,Math.min(ny,h-70));
                el.style.left=nx+'px'; el.style.top=ny+'px';
            }
            const endD=()=>{if(!start)return;start=null;const t=gameState.tokens.find(x=>x.id===id);if(t){t.x=parseInt(el.style.left);t.y=parseInt(el.style.top);updateState();}}
            el.onmousedown=e=>{if(e.button===0&&startD(e.clientX,e.clientY)){const mm=ev=>moveD(ev.clientX,ev.clientY);const mu=()=>{endD();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu)}};
            el.ontouchstart=e=>{startD(e.touches[0].clientX,e.touches[0].clientY)};
            el.ontouchmove=e=>{if(start){e.preventDefault();moveD(e.touches[0].clientX,e.touches[0].clientY)}};
            el.ontouchend=endD;
        }

        // --- CETVEL ---
        function toggleRuler(){rulerMode=!rulerMode;rulerStartPoint=null;const b=document.getElementById('btn-ruler'),a=document.getElementById('game-area'),c=document.getElementById('ruler-canvas').getContext('2d');if(rulerMode){b.classList.add('active-mode');a.classList.add('ruler-active')}else{b.classList.remove('active-mode');a.classList.remove('ruler-active');c.clearRect(0,0,9999,9999);document.getElementById('ruler-info').style.display='none'}}
        function getMapPt(e){const r=document.getElementById('map-container').getBoundingClientRect();let cx=e.clientX,cy=e.clientY;if(e.touches&&e.touches[0]){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}return{x:(cx-r.left)/mapTransform.scale,y:(cy-r.top)/mapTransform.scale}}
        const gA=document.getElementById('game-area');
        gA.addEventListener('mousedown',e=>{if(!rulerMode||e.button!==0)return;tempStart=getMapPt(e);isDraggingRuler=false});
        window.addEventListener('mousemove',e=>{if(!rulerMode)return;const c=getMapPt(e),ctx=document.getElementById('ruler-canvas').getContext('2d'),o=rulerStartPoint||tempStart;if(!o)return;if(tempStart)isDraggingRuler=true;ctx.clearRect(0,0,9999,9999);ctx.beginPath();ctx.strokeStyle='#f1c40f';ctx.lineWidth=3;ctx.setLineDash([10,5]);ctx.moveTo(o.x,o.y);ctx.lineTo(c.x,c.y);ctx.stroke();const m=(Math.hypot(c.x-o.x,c.y-o.y)/gameState.grid.size)*gameState.grid.scale;const i=document.getElementById('ruler-info');i.style.display='block';i.innerText=m.toFixed(1)+"m"});
        window.addEventListener('mouseup',e=>{if(!rulerMode)return;if(tempStart&&isDraggingRuler&&!rulerStartPoint){tempStart=null;document.getElementById('ruler-canvas').getContext('2d').clearRect(0,0,9999,9999);document.getElementById('ruler-info').style.display='none'}else if(tempStart&&!isDraggingRuler){if(!rulerStartPoint)rulerStartPoint=tempStart;else{rulerStartPoint=null;document.getElementById('ruler-canvas').getContext('2d').clearRect(0,0,9999,9999);document.getElementById('ruler-info').style.display='none'}tempStart=null}});
        gA.addEventListener('touchstart',e=>{if(rulerMode){tempStart=getMapPt(e);isDraggingRuler=false}});
        gA.addEventListener('touchend',e=>{if(rulerMode){if(tempStart&&!isDraggingRuler){if(!rulerStartPoint)rulerStartPoint=tempStart;else{rulerStartPoint=null;document.getElementById('ruler-canvas').getContext('2d').clearRect(0,0,9999,9999);}}tempStart=null}});

        // --- SHEET & ZAR ---
        function openSheet(id) {
            activeTokenId=id; const t=gameState.tokens.find(x=>x.id===id);
            if(!t.stats)t.stats={}; if(!t.meta)t.meta={align:"", traits:['','','']}; if(!t.statuses)t.statuses=[];
            document.getElementById('char-sheet-modal').style.display='flex';
            document.getElementById('sheet-name').innerText=(t.name||t.owner).toUpperCase();
            document.getElementById('sheet-token-name').value=t.name||"";
            document.getElementById('sheet-token-scale').value=t.scale||1;
            document.getElementById('sheet-align').value=t.meta.align||"";
            const ts=document.querySelectorAll('.trait-select'); ts.forEach((s,i)=>s.value=t.meta.traits[i]||"");
            if(isGM){document.getElementById('gm-vision').value=t.vision||10;document.getElementById('btn-gm-pos').style.background=t.locked?"var(--accent-red)":"#333";renderStatusGrid(t);}
            sheetLocked=false; toggleLock(); toggleLock(); renderStats(t);
        }
        function closeSheet(){document.getElementById('char-sheet-modal').style.display='none';updateState()}
        function saveSheetMeta(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.name=document.getElementById('sheet-token-name').value;t.scale=parseFloat(document.getElementById('sheet-token-scale').value);t.meta.align=document.getElementById('sheet-align').value;const ts=document.querySelectorAll('.trait-select');t.meta.traits=[ts[0].value,ts[1].value,ts[2].value];updateState()}
        function renderStatusGrid(t){const g=document.getElementById('status-grid');g.innerHTML="";CONDITIONS.forEach(c=>{const a=t.statuses.includes(c);const b=document.createElement('button');b.className=`status-btn ${a?'active-status':''}`;b.innerText=c;b.onclick=()=>{if(a)t.statuses=t.statuses.filter(x=>x!==c);else t.statuses.push(c);renderStatusGrid(t);updateState()};g.appendChild(b)})}
        function gmDeleteToken(){if(confirm("Sil?")){gameState.tokens=gameState.tokens.filter(x=>x.id!==activeTokenId);closeSheet();updateState()}}
        function gmTogglePosLock(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.locked=!t.locked;openSheet(activeTokenId);updateState()}
        function gmUpdateToken(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.vision=parseFloat(document.getElementById('gm-vision').value)||10;updateState()}
        function renderStats(t){const al=document.getElementById('attr-list'), sl=document.getElementById('skill-list'); al.innerHTML=""; sl.innerHTML=""; const cr=(k,tr,tp)=>{const s=getS(t,k);return `<div class="stat-row"><span style="color:var(--gold-text);font-size:0.75rem">${tr}</span><div class="input-group"><input type="number" min="1" max="5" value="${s.b}" onchange="upS('${k}',this.value,'${s.a}')"></div><div class="input-group"><input type="number" min="0" value="${s.a}" onchange="upS('${k}','${s.b}',this.value)"></div><button class="stat-btn-locked" onclick="selS('${k}','${tp}',this)">${tr}: ${s.b} + ${s.a}</button></div>`}; for(let k in ATTRS)al.innerHTML+=cr(k,ATTRS[k],'attr'); for(let k in SKILLS)sl.innerHTML+=cr(k,SKILLS[k],'skill');}
        window.upS=function(k,b,a){setS(gameState.tokens.find(x=>x.id===activeTokenId),k,b,a)}
        window.selS=function(k,tp,btn){if(!sheetLocked)return;if(tp==='attr'){selAttr=(selAttr===k)?null:k;document.querySelectorAll('#attr-list .stat-btn-locked').forEach(b=>b.classList.remove('selected'));if(selAttr)btn.classList.add('selected')}else{selSkill=(selSkill===k)?null:k;document.querySelectorAll('#skill-list .stat-btn-locked').forEach(b=>b.classList.remove('selected'));if(selSkill)btn.classList.add('selected')}document.getElementById('sheet-status').innerText=`Seçim: ${selAttr?ATTRS[selAttr]:'-'} + ${selSkill?SKILLS[selSkill]:'-'}`}
        function toggleLock(){sheetLocked=!sheetLocked;const b=document.querySelector('.sheet-body'),btn=document.getElementById('btn-lock');if(sheetLocked){b.classList.add('locked-mode');btn.innerText="AÇ";renderStats(gameState.tokens.find(x=>x.id===activeTokenId))}else{b.classList.remove('locked-mode');btn.innerText="KİLİTLE";selAttr=null;selSkill=null}}
        function getS(t,k){const v=t.stats[k]||"1,0";const p=v.split(',');return{b:parseInt(p[0])||1,a:parseInt(p[1])||0}}
        function setS(t,k,b,a){t.stats[k]=`${b},${a}`}

        function rollStats(){if(!selAttr&&!selSkill)return;const t=gameState.tokens.find(x=>x.id===activeTokenId);let b=0,a=0;if(selAttr){const s=getS(t,selAttr);b+=s.b;a+=s.a}if(selSkill){const s=getS(t,selSkill);b+=s.b;a+=s.a}let res=rollD(b);let total=res.h+a;broadcastLog(`<div style="border-left:3px solid var(--accent-green);padding-left:5px"><b>${(t.name||t.owner).toUpperCase()}</b><br>Zar: [${res.d}]<br>Sonuç: ${res.h}+${a}=<b>${total}</b><div class="log-actions"><button onclick="actPush(${b},${a},${total})">ZORLA</button><button onclick="actInsp(${b},${a})">İLHAM</button><button onclick="actCombo(${b},${a})">ZORLA & İLHAM</button></div></div>`)}
        function actPush(b,a,p){let ph=p-a;let f=b-ph;if(f<=0)return alert("Zorlanamaz");let r=rollD(f);let n=p+r.h;broadcastLog(`<div style="border-left:2px dashed #aaa;padding-left:5px;margin-top:5px"><i>Zorlama</i> [${r.d}]<br>YENİ: <b>${n}</b><div class="log-actions"><button onclick="actInsp(${b},${a})">İLHAM</button></div></div>`)}
        function actInsp(b,a){useInsp(1);let r=rollD(b);let t=r.h+a;updateState();broadcastLog(`<div style="border-top:1px solid #555;padding-top:5px;margin-top:5px"><b>✨ İLHAM</b> (Harc:1)<br>Yeni: [${r.d}]<br>Sonuç: <b>${t}</b><div class="log-actions"><button onclick="actPush(${b},${a},${t})">ZORLA</button></div></div>`)}
        function actCombo(b,a){const tg=parseInt(prompt("Hedef?",4));if(!tg)return;const lm=parseInt(prompt("Limit?",5));if(!lm)return;let s=0,bt=0,lt="";while(s<lm){s++;let r1=rollD(b),h=r1.h,f=b-h,p=0;if(f>0){let r2=rollD(f);p=r2.h}let t=h+p+a;lt+=`[#${s}:${t}] `;if(t>=tg){bt=t;break}if(t>bt)bt=t}useInsp(s);updateState();broadcastLog(`<div style="background:rgba(200,150,0,0.1);padding:5px;margin-top:5px"><b>🔥 COMBO</b> (Harc:${s})<br><small>${lt}</small><br>SONUÇ: <b>${bt}</b></div>`)}
        function rollD(n){let h=0,d=[];for(let i=0;i<n;i++){let r=Math.floor(Math.random()*6)+1;d.push(r);if(r===6)h++}return{h,d}}
        function useInsp(n){if(!gameState.inspiration[currentUser])gameState.inspiration[currentUser]=0;gameState.inspiration[currentUser]+=n}

        function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}

        function clearLog(){document.getElementById('log-content').innerHTML=""}
        function resizeCvs(){const i=document.getElementById('game-map'),w=i.naturalWidth||800,h=i.naturalHeight||600;['grid-canvas','fog-canvas','ruler-canvas'].forEach(id=>{const c=document.getElementById(id);c.width=w;c.height=h})}
        function clearCvs(){['grid-canvas','fog-canvas'].forEach(id=>document.getElementById(id).getContext('2d').clearRect(0,0,9999,9999))}
        function drawGrid(){const c=document.getElementById('grid-canvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!gameState.grid.show)return;x.beginPath();x.strokeStyle='rgba(255,255,255,0.1)';for(let i=0;i<=c.width;i+=gameState.grid.size){x.moveTo(i,0);x.lineTo(i,c.height)}for(let j=0;j<=c.height;j+=gameState.grid.size){x.moveTo(0,j);x.lineTo(c.width,j)}x.stroke()}
        function drawFog(){const c=document.getElementById('fog-canvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='black';x.globalAlpha=isGM?0.4:1.0;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-out';x.globalAlpha=1.0;gameState.tokens.filter(t=>isGM||t.owner===currentUser).forEach(t=>{const cx=t.x+35*(t.scale||1),cy=t.y+35*(t.scale||1),rad=((t.vision||10)/gameState.grid.scale)*gameState.grid.size;const g=x.createRadialGradient(cx,cy,rad*0.5,cx,cy,rad);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');x.beginPath();x.arc(cx,cy,rad,0,Math.PI*2);x.fillStyle=g;x.fill()});x.globalCompositeOperation='source-over'}
        function updateGrid(){if(!isGM)return;gameState.grid.size=parseInt(document.getElementById('grid-size').value)||50;gameState.grid.scale=parseFloat(document.getElementById('grid-scale').value)||1.5;gameState.grid.show=document.getElementById('grid-show').checked;updateState();}
        function changeWeather(){gameState.weather=document.getElementById('weather-select').value;updateState();}
        function applyWeather(){document.getElementById('weather-overlay').className=gameState.weather;if(isGM)document.getElementById('weather-select').value=gameState.weather;}
        function addToInit(){if(!isGM)return;gameState.initiative.list.push({id:Date.now(),name:document.getElementById('init-name').value,val:parseInt(document.getElementById('init-val').value)||0});updateState();}
        function renderInit(){const l=document.getElementById('init-list');l.innerHTML="";gameState.initiative.list.sort((a,b)=>b.val-a.val).forEach((i,idx)=>{l.innerHTML+=`<div class="list-item ${idx===gameState.initiative.currentIdx?'active':''}"><span>${i.val} ${i.name}</span>${isGM?`<button style="font-size:0.6rem;background:var(--accent-red)" onclick="rmInit(${i.id})">X</button>`:''}</div>`})}
        function nextTurn(){if(!isGM)return;gameState.initiative.currentIdx++;if(gameState.initiative.currentIdx>=gameState.initiative.list.length){gameState.initiative.currentIdx=0;gameState.initiative.round++}updateState();}
        function rmInit(id){if(!isGM)return;gameState.initiative.list=gameState.initiative.list.filter(x=>x.id!==id);updateState();}
        function clearInit(){if(!isGM)return;gameState.initiative={list:[],round:1,currentIdx:0};updateState();}
        function renderAct(){const l=document.getElementById('act-list');l.innerHTML="";Object.entries(gameState.activity.scores).sort((a,b)=>b[1]-a[1]).forEach(([u,t])=>{l.innerHTML+=`<div class="list-item"><span>${u.toUpperCase()}</span><span>${Math.floor(t/60)}:${Math.floor(t%60).toString().padStart(2,'0')}</span></div>`})}
        function resetAct(){if(isGM){gameState.activity.scores={}; localSpeechTime=0; updateState();}}
        function renderInsp(){const l=document.getElementById('insp-list');l.innerHTML="";Object.entries(gameState.inspiration).forEach(([u,v])=>{if(v>0)l.innerHTML+=`<div class="list-item"><span>${u.toUpperCase()}</span><span style="color:var(--gold-text);font-weight:bold">${v}</span></div>`})}
        function resetInsp(){if(isGM){gameState.inspiration={};updateState();}}
        function resetAll(){if(isGM&&confirm("Emin misin?")){gameState={mapSrc:null,grid:{show:true,size:50,scale:1.5},weather:"",initiative:{list:[],round:1,currentIdx:0},activity:{paused:false,scores:{}},inspiration:{},chat:[],tokens:[]};updateState();}}
        
        async function initMic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new AudioContext(),an=ac.createAnalyser();ac.createMediaStreamSource(s).connect(an);an.fftSize=512;const d=new Uint8Array(an.frequencyBinCount);const l=()=>{if(!gameState.activity.paused){an.getByteFrequencyData(d);let sm=0;for(let x of d)sm+=x;if(sm/d.length>15)localSpeechTime+=0.1}setTimeout(()=>requestAnimationFrame(l),100)};l();setInterval(()=>{if(localSpeechTime>0){gameState.activity.scores[currentUser]=localSpeechTime;db.collection('rooms').doc(currentRoom).update({[`activity.scores.${currentUser}`]:localSpeechTime})}},3000)}catch(e){console.log(e)}}

        document.getElementById('map-upload').addEventListener('change',async e=>{if(isGM&&e.target.files[0]){const u=await uploadImage(e.target.files[0]);if(u){gameState.mapSrc=u;updateState()}}});
        document.getElementById('token-upload').addEventListener('change',async e=>{if(e.target.files[0]){const u=await uploadImage(e.target.files[0]);if(u){gameState.tokens.push({id:Date.now(),owner:currentUser,x:100,y:100,imgSrc:u,scale:1,stats:{},meta:{align:"",traits:['','','']},vision:10,locked:false,statuses:[]});updateState()}}});

    </script>
</body>
</html>
