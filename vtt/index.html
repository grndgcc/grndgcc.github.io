<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İkili Evren - VTT (Final)</title>
    
    <!-- FONTLAR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturMaguntia&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <!-- FIREBASE SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(10, 10, 12, 0.95);
            --glass-border: rgba(184, 134, 11, 0.5);
            --gold-text: #deb887;
            --text-main: #d3d3d3;
            --accent-red: #8b0000;
            --accent-green: #2f4f4f;
            --blur-amt: 15px;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0; padding: 0;
            font-family: 'Cinzel', serif;
            background-color: var(--bg-color); color: var(--text-main);
            overflow: hidden; display: flex; height: 100vh; width: 100vw;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png'), radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            overscroll-behavior: none;
        }

        h1, h2, h3, h4, .gothic-title { font-family: 'UnifrakturMaguntia', cursive; letter-spacing: 2px; }
        
        input, select, textarea {
            background: rgba(0,0,0,0.6); color: #fff; 
            border: 1px solid #555; padding: 8px; border-radius: 4px; 
            width: 100%; font-family: 'Lato', sans-serif; text-align: center;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--gold-text); box-shadow: 0 0 5px var(--gold-text); }

        /* UI PANELS */
        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.5);
            color: var(--text-main); pointer-events: auto;
            backdrop-filter: blur(5px);
        }

        button {
            background: linear-gradient(to bottom, #2b2b2b, #1a1a1a);
            border: 1px solid var(--glass-border); color: var(--gold-text);
            padding: 6px 12px; border-radius: 4px; cursor: pointer;
            font-family: 'Cinzel', serif; font-weight: bold; font-size: 0.8rem;
            text-transform: uppercase; transition: 0.2s;
            text-shadow: 1px 1px 2px black;
        }
        button:hover { background: #3a3a3a; border-color: #fff; text-shadow: 0 0 8px var(--gold-text); }
        button:active { transform: translateY(1px); }
        button.active { background: var(--accent-red); color: white; border-color: white; box-shadow: 0 0 10px var(--accent-red); }

        /* DOCK */
        #ui-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; padding: 10px 20px; z-index: 2000;
            border-radius: 40px; border: 1px solid var(--glass-border);
            background: rgba(5, 5, 5, 0.95); box-shadow: 0 0 20px black;
        }
        .dock-btn {
            width: 50px; height: 50px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.4rem; border: 1px solid #444; background: #111; position: relative;
        }
        .dock-btn:hover { transform: scale(1.1); z-index: 10; }
        .dock-btn.active-mode { border-color: var(--gold-text); background: var(--accent-red); }

        /* SIDEBAR & PANELS */
        #sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 350px; z-index: 1500;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            transform: translateX(-370px); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            background: rgba(10,10,12, 0.98); border-right: 2px solid var(--glass-border);
        }
        #sidebar.open { transform: translateX(0); }
        
        .float-panel {
            position: fixed; z-index: 500; padding: 10px; display: none; flex-direction: column;
            min-width: 260px; max-width: 340px; max-height: 80vh;
        }
        .float-panel.visible { display: flex; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        .float-header { 
            font-family: 'UnifrakturMaguntia', cursive; font-size: 1.2rem; color: var(--gold-text); 
            border-bottom: 1px solid #555; padding-bottom: 5px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; cursor: move; 
        }

        #panel-initiative { top: 80px; right: 20px; }
        #panel-activity { top: 80px; left: 380px; }
        #panel-inspiration { top: 20px; right: 280px; width: 180px; text-align: center; }
        #panel-log { bottom: 100px; right: 20px; width: 340px; height: 350px; }
        #panel-chat { bottom: 100px; left: 20px; width: 320px; height: 400px; }
        #panel-journal { top: 120px; left: 50%; transform: translateX(-50%); width: 500px; height: 600px; }
        #panel-album { top: 100px; left: 100px; width: 600px; height: 500px; }

        .list-container { flex-grow: 1; overflow-y: auto; font-size: 0.9rem; scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent; }
        .list-item { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .list-item.active { background: rgba(184, 134, 11, 0.2); border-left: 3px solid var(--gold-text); }

        .control-group { background: rgba(255,255,255,0.02); padding: 12px; border: 1px solid #333; border-radius: 6px; }
        .control-label { color: #aaa; font-size: 0.7rem; display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }

        .album-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 10px; padding: 10px; }
        .album-item {
            width: 80px; height: 80px; border: 1px solid #555; border-radius: 5px;
            background-size: cover; background-position: center; cursor: pointer; transition: transform 0.2s; position: relative;
        }
        .album-item:hover { transform: scale(1.1); border-color: var(--gold-text); z-index: 10; }
        .album-item button {
            position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; padding: 0;
            font-size: 10px; background: red; color: white; border-radius: 50%; display: none;
        }
        .gm-only .album-item:hover button { display: block; }

        /* GAME AREA */
        #game-area { position: absolute; top:0; left:0; width:100%; height:100%; overflow: hidden; cursor: default; z-index: 0; }
        #map-container { position: absolute; top:0; left:0; transform-origin: 0 0; }
        #game-map { position: absolute; z-index: 1; pointer-events: none; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        #grid-canvas { z-index: 2; }
        #fog-canvas { z-index: 3; }
        #ruler-canvas { z-index: 20; }
        #weather-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 15; pointer-events: none; }
        .ruler-active { cursor: crosshair !important; }

        /* TOKENS */
        .token {
            position: absolute; z-index: 10; border-radius: 50%;
            border: 2px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.9);
            background-size: cover; background-position: center; transition: border-color 0.2s;
        }
        .token.my-token { border-color: var(--accent-green); cursor: grab; box-shadow: 0 0 15px var(--accent-green); }
        .token.other-token { border-color: var(--accent-red); }
        .token.locked-token { cursor: not-allowed; border-style: dashed; opacity: 0.8; }
        .token:active { cursor: grabbing; transform: scale(1.05); }
        
        .token-name {
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 2px 6px; border-radius: 4px;
            font-size: 11px; white-space: nowrap; pointer-events: none; color: var(--gold-text);
            font-weight: bold; border: 1px solid #444; z-index: 20;
        }
        .token-statuses { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; pointer-events: none; z-index: 15; }
        .status-badge { background: #000; color: #f1c40f; padding: 1px 4px; border-radius: 3px; font-size: 8px; border: 1px solid #555; }
        
        .token.is-dead { filter: grayscale(100%) brightness(50%); }
        .token.is-dead::after {
            content: 'X'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 50px; color: red; font-family: sans-serif; font-weight: bold; pointer-events: none; text-shadow: 0 0 5px black;
        }

        .token-tooltip {
            position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%);
            background: rgba(10,10,10,0.95); border: 1px solid var(--gold-text);
            padding: 10px; border-radius: 5px; width: 220px; pointer-events: none;
            display: none; z-index: 100; text-align: left; font-size: 0.8rem;
            box-shadow: 0 5px 20px black; font-family: 'Lato', sans-serif;
        }
        .token:hover .token-tooltip { display: block; }
        .tt-header { font-family: 'Cinzel', serif; font-weight: bold; color: var(--gold-text); border-bottom: 1px solid #555; margin-bottom: 5px; }
        .tt-row { display: flex; justify-content: space-between; font-size: 0.75rem; margin-bottom: 2px; }

        /* SHEET */
        #char-sheet-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 800px; max-width: 95%; height: 800px; max-height: 95%; z-index: 5000;
            padding: 0; flex-direction: column;
        }
        .sheet-body { padding: 20px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex-grow:1; }
        .gm-controls-area { background: rgba(50, 10, 10, 0.3); border: 1px solid var(--accent-red); padding: 10px; margin-top: 10px; border-radius: 5px; }
        .stat-row { 
            display: grid; grid-template-columns: 100px 1fr 1fr; gap: 5px; align-items: center;
            margin-bottom: 5px; padding: 4px; background: rgba(255,255,255,0.03); border-radius: 4px;
        }
        .stat-btn-locked { grid-column: 1 / span 3; text-align: left; width: 100%; background: transparent; color:white; border:none; padding:10px; display:none; font-family: 'Cinzel'; }
        .locked-mode .input-group { display: none; }
        .locked-mode .stat-btn-locked { display: block; }
        .locked-mode .stat-btn-locked:hover { background: rgba(255,255,255,0.1); }
        .locked-mode .stat-btn-locked.selected { background: var(--gold-text); color: black; font-weight: bold; }
        
        .status-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 5px; }
        .status-btn { font-size: 0.6rem; padding: 4px; background: #222; border: 1px solid #444; color: #888; }
        .status-btn.active-status { background: var(--accent-red); color: white; border-color: white; box-shadow: 0 0 5px red; }

        /* LOG & CHAT */
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; font-size: 0.85rem; font-family: 'Lato'; }
        .chat-msg { margin-bottom: 5px; word-wrap: break-word; font-size:0.9rem; font-family: 'Lato'; }
        .chat-msg b { color: var(--gold-text); font-family: 'Cinzel'; }
        .chat-gif { max-width: 100%; border-radius: 4px; margin-top:5px; border:1px solid #444; }

        /* WEATHER */
        .w-rain { background-image: linear-gradient(to bottom, rgba(150,150,200,0.3) 1px, transparent 1px); background-size: 5px 20px; animation: rain 0.3s linear infinite; }
        .w-snow { background-image: radial-gradient(rgba(255,255,255,0.8) 2px, transparent 2px); background-size: 50px 50px; animation: snow 5s linear infinite; }
        .w-fog { background: linear-gradient(to right, rgba(200,200,200,0.1), rgba(150,150,150,0.2)); animation: fog 10s ease infinite alternate; }
        @keyframes rain { 0% {background-position: 0 0;} 100% {background-position: 0 100%;} }
        @keyframes snow { 0% {background-position: 0 0;} 100% {background-position: 20px 100vh;} }
        @keyframes fog { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }

        /* MOBILE */
        @media (max-width: 768px) {
            #ui-dock { width: 95%; justify-content: space-between; padding: 8px; bottom: 10px; }
            #sidebar { width: 100%; }
            .float-panel { width: 95% !important; left: 2.5% !important; right: 2.5% !important; top: 60px !important; max-height: 50vh; }
            #panel-log, #panel-chat { bottom: 80px !important; top: auto !important; height: 300px !important; }
            #panel-journal, #panel-album { width: 95%; height: 70%; top: 10%; left: 2.5%; transform: none; }
            .sheet-body { grid-template-columns: 1fr; }
            .gm-controls-area { grid-template-columns: 1fr; }
            #inspiration-box { width: 100% !important; position: relative; left:0; top:0; }
        }
        .gm-only { display: none; }
    </style>
</head>
<body>

    <div id="loading-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;justify-content:center;align-items:center;color:var(--gold-text);">
        <div style="font-size:2rem;">⚔️ YÜKLENİYOR...</div>
    </div>

    <!-- GİRİŞ -->
    <div id="login-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#050505;z-index:9999;display:flex;justify-content:center;align-items:center;">
        <div class="glass-panel" style="padding:40px; text-align:center; width:300px; border:2px solid var(--gold-text);">
            <h1 class="gothic-title" style="color:var(--gold-text); font-size:2rem;">İKİLİ EVREN</h1>
            <p style="color:#aaa; font-size:0.7rem; margin-bottom:20px;">ONLINE VTT</p>
            <input type="text" id="room-input" placeholder="Oda Adı" style="margin-bottom:10px;">
            <small style="color:#777; display:block; margin-bottom:10px;">Şifreler: gm111, 111, 222, 333</small>
            <select id="role-select" style="margin-bottom:10px;">
                <option value="gm1">GM (Yönetici)</option>
                <option value="player1">Oyuncu 1</option>
                <option value="player2">Oyuncu 2</option>
                <option value="player3">Oyuncu 3</option>
            </select>
            <input type="password" id="password-input" placeholder="Şifre" style="margin-bottom:15px;">
            <button onclick="attemptLogin()" style="width:100%; padding:12px;">BAĞLAN</button>
            <p id="login-msg" style="color:var(--accent-red); margin-top:10px; font-size:0.8rem;"></p>
        </div>
    </div>

    <!-- UI KATMANLARI -->
    <div id="weather-overlay"></div>
    <div id="ruler-info" style="position:fixed; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); border:1px solid var(--gold-text); padding:5px 15px; border-radius:20px; display:none; z-index:2000; pointer-events:none; color:var(--gold-text); font-weight:bold;">0m</div>

    <!-- DOCK -->
    <div id="ui-dock">
        <button class="dock-btn" onclick="toggleSidebar()" title="Ayarlar">⚙️</button>
        <button class="dock-btn" onclick="togglePanel('panel-initiative')" title="Sıra">⚔️</button>
        <button class="dock-btn" onclick="togglePanel('panel-activity')" title="Ses">🎤</button>
        <button class="dock-btn" onclick="togglePanel('panel-inspiration')" title="İlham">✨</button>
        <button class="dock-btn" id="btn-ruler" onclick="toggleRuler()" title="Cetvel">📏</button>
        <button class="dock-btn" onclick="togglePanel('panel-journal')" title="Günlük">📖</button>
        <button class="dock-btn" onclick="togglePanel('panel-album')" title="Albüm">🖼️</button>
        <button class="dock-btn" onclick="togglePanel('panel-chat')" title="Sohbet">💬</button>
        <button class="dock-btn" onclick="togglePanel('panel-log')" title="Log">📜</button>
    </div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-border); padding-bottom:10px;">
            <h3 id="user-display" style="color:var(--gold-text); margin:0;">USER</h3> 
            <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:1.2rem;">✕</button>
        </div>
        
        <div class="control-group gm-only">
            <span class="control-label">HARİTA (URL)</span> 
            <div style="display:flex; gap:5px;">
                <input type="text" id="map-url" placeholder="Resim Linki">
                <button onclick="setMapURL()" style="width:auto;">YÜKLE</button>
            </div>
            
            <div style="margin-top:10px; display:flex; gap:5px; align-items:center;">
                <span class="control-label" style="margin:0;">GRID:</span>
                <input type="number" id="grid-size" value="50" onchange="updateGrid()" placeholder="px" style="width:50px;">
                <input type="number" id="grid-scale" value="1.5" step="0.5" onchange="updateGrid()" placeholder="m" style="width:50px;">
                <input type="checkbox" id="grid-show" onchange="updateGrid()" checked style="width:auto;">
            </div>
        </div>

        <div class="control-group">
            <span class="control-label">TOKEN EKLE (ÇOKLU URL)</span> 
            <textarea id="token-url-area" rows="3" placeholder="Her satıra bir resim linki..."></textarea>
            <button onclick="addTokenBulk()" style="width:100%; margin-top:5px;">HEPSİNİ EKLE</button>
        </div>

        <div class="control-group">
            <span class="control-label">AYARLAR</span> 
            <label style="font-size:0.8rem; display:block; cursor:pointer;">
                <input type="checkbox" id="show-tooltips" onchange="toggleTooltips()" checked style="width:auto;"> Hover Özeti Göster
            </label>
        </div>

        <div class="control-group gm-only">
            <span class="control-label">ATMOSFER</span>
            <select id="weather-select" onchange="changeWeather()" style="margin-bottom:5px;">
                <option value="">Açık</option>
                <option value="w-rain">Yağmur</option>
                <option value="w-snow">Kar</option>
                <option value="w-fog">Sis</option>
            </select>
            <button onclick="resetAll()" style="width:100%; background:var(--accent-red);">HER ŞEYİ SIFIRLA</button>
        </div>
    </div>

    <!-- PANELLER -->
    <div id="panel-initiative" class="glass-panel float-panel"><div class="float-header">TUR SIRASI <span id="round-display">T:1</span></div><div id="init-list" class="list-container"></div><div class="gm-only"><input type="text" id="init-name" placeholder="İsim"><input type="number" id="init-val" placeholder="Init"><button onclick="addToInit()">EKLE</button><button onclick="nextTurn()">İLERİ</button><button onclick="clearInit()">SİL</button></div></div>
    <div id="panel-activity" class="glass-panel float-panel"><div class="float-header">KONUŞMA</div><div id="act-list" class="list-container"></div><div class="gm-only"><button onclick="resetAct()">SIFIRLA</button></div></div>
    <div id="panel-inspiration" class="glass-panel float-panel visible"><div class="float-header">İLHAM</div><div id="insp-list" class="list-container" style="max-height:100px;"></div><div class="gm-only"><button onclick="resetInsp()">SIFIRLA</button></div></div>
    <div id="panel-log" class="glass-panel float-panel visible"><div class="float-header">GÜNLÜK <button onclick="clearLog()" style="font-size:0.6rem;">TEMİZLE</button></div><div id="log-content" class="list-container"></div></div>
    <div id="panel-journal" class="glass-panel float-panel"><div class="float-header">ÖZEL GÜNLÜK <button onclick="togglePanel('panel-journal')">X</button></div><textarea id="journal-text" style="flex-grow:1; background:rgba(0,0,0,0.3); color:#ddd; font-family:'Lato'; padding:10px; border:none; resize:none;" placeholder="Sadece siz görürsünüz..."></textarea></div>
    
    <div id="panel-album" class="glass-panel float-panel">
        <div class="float-header">TOKEN ALBÜMÜ <button onclick="togglePanel('panel-album')">X</button></div>
        <div id="album-grid" class="album-grid list-container"></div>
        <div style="font-size:0.7rem; color:#aaa; padding:5px; text-align:center;">Tıkla -> Haritaya Ekle</div>
    </div>

    <div id="panel-chat" class="glass-panel float-panel">
        <div class="float-header">SOHBET</div>
        <div id="chat-content" class="list-container" style="background:rgba(0,0,0,0.3); padding:5px;"></div>
        <div style="margin-top:5px; display:flex; gap:2px;"><input type="text" id="chat-input" placeholder="Mesaj..." onkeypress="if(event.key==='Enter') sendChat()"><button onclick="sendChat()">></button></div>
        <button onclick="sendGif()" style="width:100%; font-size:0.7rem; margin-top:2px; background:#333;">GIF</button>
    </div>

    <!-- OYUN ALANI -->
    <div id="game-area">
        <div id="map-container">
            <img id="game-map" src="" draggable="false">
            <canvas id="grid-canvas"></canvas>
            <canvas id="fog-canvas"></canvas>
            <canvas id="ruler-canvas"></canvas>
        </div>
    </div>

    <!-- KARAKTER KAĞIDI MODALI -->
    <div id="char-sheet-modal" class="glass-panel">
        <div style="padding:15px; border-bottom:1px solid #444; display:flex; justify-content:space-between;">
            <h2 id="sheet-name" style="margin:0; color:var(--gold-text);"></h2>
            <div><button id="btn-lock" onclick="toggleLock()">KİLİTLE</button> <button onclick="closeSheet()">X</button></div>
        </div>
        <div class="sheet-body">
            <!-- Sol -->
            <div>
                <div class="control-group" style="margin-bottom:10px;">
                    <label class="control-label">GÖRÜNÜM</label>
                    <input type="text" id="sheet-token-name" placeholder="Token Adı" onchange="saveSheetMeta()">
                    <div style="display:flex; align-items:center; gap:5px; margin-top:5px;">
                        <span style="font-size:0.7rem;">Boyut:</span>
                        <input type="range" id="sheet-token-scale" min="0.5" max="3" step="0.1" onchange="saveSheetMeta()">
                    </div>
                </div>
                <select id="sheet-align" onchange="saveSheetMeta()" style="margin-bottom:5px;"><option value="">Yönelim...</option><option>Kuralcı İyi</option><option>Nötr İyi</option><option>Kaotik İyi</option><option>Kuralcı Nötr</option><option>Tam Nötr</option><option>Kaotik Nötr</option><option>Kuralcı Kötü</option><option>Nötr Kötü</option><option>Kaotik Kötü</option></select>
                <select class="trait-select" onchange="saveSheetMeta()"></select> <select class="trait-select" onchange="saveSheetMeta()"></select> <select class="trait-select" onchange="saveSheetMeta()"></select>

        // --- 1. CONFIG & INIT (ABSOLUTE TOP) ---
        const firebaseConfig = {

        // --- CONSTANTS ---

        let currentRoom=null, currentUser=null, isGM=false;

        // --- LOGIN ---
        async function attemptLogin() {
            const room = document.getElementById('room-input').value.trim();
            const role = document.getElementById('role-select').value;
            const pass = document.getElementById('password-input').value;
            if(!room) return alert("Oda adı girin.");
            
            showLoading(true);
            try {
                const ref = db.collection('rooms').doc(room);
                const doc = await ref.get();
                if(!doc.exists) {
                    if(pass !== CREDENTIALS[role]) throw new Error("Yeni oda için varsayılan şifreleri kullanın.");
                    await ref.set({ users:CREDENTIALS, mapSrc:null, grid:{show:true,size:50,scale:1.5}, weather:"", initiative:{list:[],round:1,currentIdx:0}, activity:{paused:false,scores:{},speaking:null}, inspiration:{}, chat:[], tokens:[], tokenLibrary:[] });
                } else {
                    const data = doc.data();
                    if(data.users && data.users[role] !== pass) throw new Error("Hatalı Şifre");
                }
                
                currentRoom=room; currentUser=role; isGM=role.startsWith('gm');
                document.getElementById('login-screen').style.display='none';
                document.getElementById('user-display').innerText=role.toUpperCase();
                if(isGM) document.querySelectorAll('.gm-only').forEach(e=>e.style.display='block');
                
                const saved = localStorage.getItem('vtt_journal_'+currentUser+'_'+currentRoom);
                if(saved) document.getElementById('journal-text').value = saved;
                
                const opts = `<option value="">Özellik...</option>` + TRAITS.map(t=>`<option>${t}</option>`).join('');
                document.querySelectorAll('.trait-select').forEach(s=>s.innerHTML=opts);

                ref.onSnapshot(snap => { if(snap.exists) { gameState=snap.data(); renderAll(); } });
                initZoomPan(); initMic(); setupClipboard();
            } catch(e) { alert(e.message); } finally { showLoading(false); }
        }

        function updateState() { if(currentRoom) { if(gameState.chat.length>50)gameState.chat=gameState.chat.slice(-50); db.collection('rooms').doc(currentRoom).update(gameState).catch(console.error); } }
        function showLoading(s) { document.getElementById('loading-overlay').style.display=s?'flex':'none'; }
        document.getElementById('journal-text').addEventListener('input', function(){ if(currentUser&&currentRoom) localStorage.setItem('vtt_journal_'+currentUser+'_'+currentRoom, this.value); });

        // --- MAP URL & TOKEN BULK ---
        function setMapURL() { const u=document.getElementById('map-url').value; if(u){ gameState.mapSrc=u; updateState(); } }
        function addTokenBulk() {
            const txt = document.getElementById('token-url-area').value;
            const urls = txt.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);
            if(urls.length===0) return;
            if(!gameState.tokenLibrary) gameState.tokenLibrary = [];
            urls.forEach(u => {
                if(!gameState.tokenLibrary.includes(u)) gameState.tokenLibrary.push(u);
                gameState.tokens.push({ id: Date.now()+Math.random(), owner: currentUser, x:100, y:100, imgSrc: u, scale:1, stats:{}, meta:{align:"",traits:['','','']}, vision:10, locked:false, statuses:[] });
            });
            document.getElementById('token-url-area').value = "";
            updateState();
        }

        // --- ALBUM ---
        function renderAlbum() {
            const grid = document.getElementById('album-grid'); grid.innerHTML = "";
            if(!gameState.tokenLibrary) return;
            gameState.tokenLibrary.forEach(url => {
                const item = document.createElement('div'); item.className = 'album-item';
                item.style.backgroundImage = `url(${url})`;
                item.onclick = () => addToMapFromAlbum(url);
                if(isGM) {
                    const del = document.createElement('button'); del.innerText = "X";
                    del.onclick = (e) => { e.stopPropagation(); gameState.tokenLibrary = gameState.tokenLibrary.filter(u=>u!==url); updateState(); };
                    item.appendChild(del);
                }
                grid.appendChild(item);
            });
        }
        function addToMapFromAlbum(url) {
            gameState.tokens.push({ id: Date.now(), owner: currentUser, x:100, y:100, imgSrc: url, scale:1, stats:{}, meta:{align:"",traits:['','','']}, vision:10, locked:false, statuses:[] });
            updateState();
        }

        // --- CLIPBOARD (GM) ---
        let clipboardToken = null;
        document.addEventListener('mousemove', e => {
            const rect = document.getElementById('map-container').getBoundingClientRect();
            mousePos = { x: (e.clientX - rect.left) / mapTransform.scale, y: (e.clientY - rect.top) / mapTransform.scale };
        });
        function setupClipboard() {
            document.addEventListener('keydown', e => {
                if(!isGM) return;
                if((e.ctrlKey||e.metaKey) && e.key==='c' && activeTokenId) {
                    const t = gameState.tokens.find(x => x.id === activeTokenId);
                    if(t) { clipboardToken = JSON.parse(JSON.stringify(t)); }
                }
                if((e.ctrlKey||e.metaKey) && e.key==='v' && clipboardToken) {
                    const newToken = JSON.parse(JSON.stringify(clipboardToken));
                    newToken.id = Date.now(); newToken.x = mousePos.x || 100; newToken.y = mousePos.y || 100;
                    gameState.tokens.push(newToken); updateState();
                }
            });
        }

        // --- RENDER ---
        function renderAll() { 
            renderMap(); renderInit(); renderAct(); renderInsp(); renderChat(); renderAlbum(); applyWeather();
            if(!isGM){ document.getElementById('grid-size').value=gameState.grid.size; document.getElementById('grid-scale').value=gameState.grid.scale; }
        }

        // --- MAP RENDER ---
        function renderMap() {
            const m = document.getElementById('game-map');
            if(gameState.mapSrc && m.src!==gameState.mapSrc) { m.src=gameState.mapSrc; m.onload=()=>{resizeCvs();drawGrid();drawFog();}; m.style.display='block'; }
            else if(!gameState.mapSrc) { m.style.display='none'; clearCvs(); }
            else { drawGrid(); drawFog(); }

            const mc = document.getElementById('map-container');
            document.querySelectorAll('.token').forEach(e=>e.remove());
            
            gameState.tokens.forEach(t=>{
                const size=70*(t.scale||1);
                const el=document.createElement('div'); el.className='token';
                el.style.width=size+'px'; el.style.height=size+'px';
                el.style.left=t.x+'px'; el.style.top=t.y+'px';
                el.style.backgroundImage=`url(${t.imgSrc})`;
                
                const isOwn = t.owner===currentUser || isGM;
                let vis=isGM;
                if(!vis) {
                    const mines=gameState.tokens.filter(x=>x.owner===currentUser);
                    for(let m of mines) { const rad=((m.vision||10)/gameState.grid.scale)*gameState.grid.size; if(Math.hypot(t.x-m.x,t.y-m.y)<rad) vis=true; }
                }
                if(!vis) el.classList.add('hidden-in-fog');

                if(isOwn) {
                    el.classList.add('my-token');
                    if(t.locked && !isGM) el.classList.add('locked-token'); else addDrag(el,t.id);
                    const g=document.createElement('div'); g.className='token-gear'; g.innerHTML='⚙️';
                    g.onclick=e=>{e.stopPropagation(); openSheet(t.id);}
                    g.onmousedown=e=>e.stopPropagation(); g.ontouchstart=e=>e.stopPropagation();
                    el.appendChild(g);
                } else el.classList.add('other-token');

                const n=document.createElement('div'); n.className='token-name'; n.innerText=(t.name||t.owner).toUpperCase(); el.appendChild(n);
                if(t.statuses?.length>0) {
                    if(t.statuses.includes("Öldü")) el.classList.add('is-dead');
                    const sb=document.createElement('div'); sb.className='token-statuses';
                    t.statuses.forEach(s=>{if(s!=="Öldü")sb.innerHTML+=`<span class="status-badge">${s}</span>`}); el.appendChild(sb);
                }
                if(showTooltips) {
                    const tip=document.createElement('div'); tip.className='token-tooltip';
                    const hp=t.stats['Constitution']?t.stats['Constitution'].split(',')[0]*2+10:10;
                    const traits=t.meta?.traits?t.meta.traits.filter(x=>x).join(', '):'-';
                    tip.innerHTML=`<div class="tt-header">${(t.name||"Adsız")}</div><div class="tt-row"><span>HP:</span> <b>~${hp}</b></div><div class="tt-row"><span>Yön:</span> <span>${t.meta?.align||"-"}</span></div><div class="tt-row"><span>Kişilik:</span> <span style="font-size:0.65rem">${traits}</span></div>`;
                    el.appendChild(tip);
                }
                el.addEventListener('click', () => { activeTokenId = t.id; });
                mc.appendChild(el);
            });
        }

        function addDrag(el, id) {
            let start=null, initPos=null; const img=document.getElementById('game-map');
            const startD=(x,y)=>{if(rulerMode)return false;start={x,y};initPos={left:parseInt(el.style.left||0),top:parseInt(el.style.top||0)};return true;}
            const moveD=(x,y)=>{
                if(!start)return;
                let nx=initPos.left+(x-start.x)/mapTransform.scale, ny=initPos.top+(y-start.y)/mapTransform.scale;
                const w=img.naturalWidth||800, h=img.naturalHeight||600;
                nx=Math.max(0,Math.min(nx,w-70)); ny=Math.max(0,Math.min(ny,h-70));
                el.style.left=nx+'px'; el.style.top=ny+'px';
            }
            const endD=()=>{if(!start)return;start=null;const t=gameState.tokens.find(x=>x.id===id);if(t){t.x=parseInt(el.style.left);t.y=parseInt(el.style.top);updateState();}}
            el.onmousedown=e=>{if(e.button===0&&startD(e.clientX,e.clientY)){const mm=ev=>moveD(ev.clientX,ev.clientY);const mu=()=>{endD();window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu)}};
            el.ontouchstart=e=>{startD(e.touches[0].clientX,e.touches[0].clientY)};
            el.ontouchmove=e=>{if(start){e.preventDefault();moveD(e.touches[0].clientX,e.touches[0].clientY)}};
            el.ontouchend=endD;
        }

        // --- CETVEL (FIXED) ---
        function toggleRuler(){rulerMode=!rulerMode;rulerStartPoint=null;const b=document.getElementById('btn-ruler'),a=document.getElementById('game-area'),c=document.getElementById('ruler-canvas').getContext('2d');if(rulerMode){b.classList.add('active-mode');a.classList.add('ruler-active')}else{b.classList.remove('active-mode');a.classList.remove('ruler-active');c.clearRect(0,0,c.canvas.width,c.canvas.height);document.getElementById('ruler-info').style.display='none'}}
        function getMapPt(e){const r=document.getElementById('map-container').getBoundingClientRect();let cx=e.clientX,cy=e.clientY;if(e.touches&&e.touches[0]){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}return{x:(cx-r.left)/mapTransform.scale,y:(cy-r.top)/mapTransform.scale}}
        const gArea=document.getElementById('game-area');
        gArea.addEventListener('mousedown',e=>{if(!rulerMode||e.button!==0)return;tempStart=getMapPt(e);isDraggingRuler=false});
        window.addEventListener('mousemove',e=>{if(!rulerMode)return;const c=getMapPt(e),ctx=document.getElementById('ruler-canvas').getContext('2d'),o=rulerStartPoint||tempStart;if(!o)return;if(tempStart)isDraggingRuler=true;ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.beginPath();ctx.strokeStyle='#f1c40f';ctx.lineWidth=3;ctx.setLineDash([10,5]);ctx.moveTo(o.x,o.y);ctx.lineTo(c.x,c.y);ctx.stroke();const m=(Math.hypot(c.x-o.x,c.y-o.y)/gameState.grid.size)*gameState.grid.scale;const i=document.getElementById('ruler-info');i.style.display='block';i.innerText=m.toFixed(1)+"m"});
        window.addEventListener('mouseup',e=>{if(!rulerMode)return;const ctx=document.getElementById('ruler-canvas').getContext('2d'); if(tempStart&&isDraggingRuler&&!rulerStartPoint){tempStart=null;ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);document.getElementById('ruler-info').style.display='none'}else if(tempStart&&!isDraggingRuler){if(!rulerStartPoint)rulerStartPoint=tempStart;else{rulerStartPoint=null;ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);document.getElementById('ruler-info').style.display='none'}tempStart=null}});
        gArea.addEventListener('touchstart',e=>{if(rulerMode){tempStart=getMapPt(e);isDraggingRuler=false}});
        gArea.addEventListener('touchend',e=>{if(rulerMode){if(tempStart&&!isDraggingRuler){if(!rulerStartPoint)rulerStartPoint=tempStart;else{rulerStartPoint=null;document.getElementById('ruler-canvas').getContext('2d').clearRect(0,0,9999,9999);}}tempStart=null}});

        // --- ZOOM & PAN ---
        function initZoomPan(){
            const area=document.getElementById('game-area'), cont=document.getElementById('map-container');
            let isPanning=false, startX=0, startY=0;
            function apply() { cont.style.transform = `translate(${mapTransform.x}px, ${mapTransform.y}px) scale(${mapTransform.scale})`; }
            area.addEventListener('wheel', e => { e.preventDefault(); const delta = e.deltaY>0?0.9:1.1; const newScale = Math.min(Math.max(0.1, mapTransform.scale*delta), 5); const rect=area.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top; mapTransform.x = mx - (mx - mapTransform.x)*(newScale/mapTransform.scale); mapTransform.y = my - (my - mapTransform.y)*(newScale/mapTransform.scale); mapTransform.scale = newScale; apply(); }, {passive:false});
            area.addEventListener('contextmenu',e=>e.preventDefault());
            area.addEventListener('mousedown',e=>{if(e.button===2){isPanning=true;startX=e.clientX-mapTransform.x;startY=e.clientY-mapTransform.y;area.style.cursor='grabbing';}});
            window.addEventListener('mousemove',e=>{if(isPanning){e.preventDefault();mapTransform.x=e.clientX-startX;mapTransform.y=e.clientY-startY;apply();}});
            window.addEventListener('mouseup',()=>{isPanning=false;area.style.cursor='default';});
            let initDist=0, initScale=1;
            area.addEventListener('touchstart',e=>{if(e.touches.length===2){initDist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);initScale=mapTransform.scale;}},{passive:false});
            area.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);const delta=dist/initDist;mapTransform.scale=Math.min(Math.max(0.1,initScale*delta),5);apply();}},{passive:false});
        }

        // --- UTILS ---
        function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
        function togglePanel(id){document.getElementById(id).classList.toggle('visible')}
        function toggleTooltips(){showTooltips=document.getElementById('show-tooltips').checked; renderMap();}
        function addLog(h){const c=document.getElementById('log-content');const d=document.createElement('div');d.className='log-entry';d.innerHTML=h;c.prepend(d)}
        function clearLog(){document.getElementById('log-content').innerHTML=""}
        function resizeCvs(){const i=document.getElementById('game-map'),w=i.naturalWidth||800,h=i.naturalHeight||600;['grid-canvas','fog-canvas','ruler-canvas'].forEach(id=>{const c=document.getElementById(id);c.width=w;c.height=h})}
        function clearCvs(){['grid-canvas','fog-canvas'].forEach(id=>document.getElementById(id).getContext('2d').clearRect(0,0,9999,9999))}
        function drawGrid(){const c=document.getElementById('grid-canvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!gameState.grid.show)return;x.beginPath();x.strokeStyle='rgba(255,255,255,0.1)';for(let i=0;i<=c.width;i+=gameState.grid.size){x.moveTo(i,0);x.lineTo(i,c.height)}for(let j=0;j<=c.height;j+=gameState.grid.size){x.moveTo(0,j);x.lineTo(c.width,j)}x.stroke()}
        function drawFog(){const c=document.getElementById('fog-canvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='black';x.globalAlpha=isGM?0.4:1.0;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-out';x.globalAlpha=1.0;gameState.tokens.filter(t=>isGM||t.owner===currentUser).forEach(t=>{const cx=t.x+35*(t.scale||1),cy=t.y+35*(t.scale||1),rad=((t.vision||10)/gameState.grid.scale)*gameState.grid.size;const g=x.createRadialGradient(cx,cy,rad*0.5,cx,cy,rad);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');x.beginPath();x.arc(cx,cy,rad,0,Math.PI*2);x.fillStyle=g;x.fill()});x.globalCompositeOperation='source-over'}
        function updateGrid(){if(!isGM)return;gameState.grid.size=parseInt(document.getElementById('grid-size').value)||50;gameState.grid.scale=parseFloat(document.getElementById('grid-scale').value)||1.5;gameState.grid.show=document.getElementById('grid-show').checked;updateState();}
        function changeWeather(){gameState.weather=document.getElementById('weather-select').value;updateState();}
        function applyWeather(){document.getElementById('weather-overlay').className=gameState.weather;if(isGM)document.getElementById('weather-select').value=gameState.weather;}
        function sendChat(){const i=document.getElementById('chat-input'),t=i.value.trim();if(!t)return;gameState.chat.push({u:currentUser,t:t,type:'text'});updateState();i.value=""}
        function sendGif(){const u=prompt("GIF Link:");if(u){gameState.chat.push({u:currentUser,t:u,type:'gif'});updateState()}}
        function renderChat(){const c=document.getElementById('chat-content');c.innerHTML=gameState.chat.map(m=>`<div class="chat-msg"><b>${m.u.toUpperCase()}:</b> ${m.type==='gif'?`<img src="${m.t}" class="chat-gif">`:m.t}</div>`).join('');c.scrollTop=c.scrollHeight}
        function addToInit(){if(!isGM)return;gameState.initiative.list.push({id:Date.now(),name:document.getElementById('init-name').value,val:parseInt(document.getElementById('init-val').value)||0});updateState();}
        function renderInit(){const l=document.getElementById('init-list');l.innerHTML="";gameState.initiative.list.sort((a,b)=>b.val-a.val).forEach((i,idx)=>{l.innerHTML+=`<div class="list-item ${idx===gameState.initiative.currentIdx?'active':''}"><span>${i.val} ${i.name}</span>${isGM?`<button style="font-size:0.6rem;background:var(--accent-red)" onclick="rmInit(${i.id})">X</button>`:''}</div>`})}
        function nextTurn(){if(!isGM)return;gameState.initiative.currentIdx++;if(gameState.initiative.currentIdx>=gameState.initiative.list.length){gameState.initiative.currentIdx=0;gameState.initiative.round++}updateState();}
        function rmInit(id){if(!isGM)return;gameState.initiative.list=gameState.initiative.list.filter(x=>x.id!==id);updateState();}
        function clearInit(){if(!isGM)return;gameState.initiative={list:[],round:1,currentIdx:0};updateState();}
        function renderAct(){const l=document.getElementById('act-list');l.innerHTML="";Object.entries(gameState.activity.scores).sort((a,b)=>b[1]-a[1]).forEach(([u,t])=>{l.innerHTML+=`<div class="list-item"><span>${u.toUpperCase()}</span><span>${Math.floor(t/60)}:${Math.floor(t%60).toString().padStart(2,'0')}</span></div>`})}
        function resetAct(){if(isGM){gameState.activity.scores={};localSpeechTime=0;updateState();}}
        function renderInsp(){const l=document.getElementById('insp-list');l.innerHTML="";Object.entries(gameState.inspiration).forEach(([u,v])=>{if(v>0)l.innerHTML+=`<div class="list-item"><span>${u.toUpperCase()}</span><span style="color:var(--gold-text);font-weight:bold">${v}</span></div>`})}
        function resetInsp(){if(isGM){gameState.inspiration={};updateState();}}
        function resetAll(){if(isGM&&confirm("Emin misin?")){gameState={mapSrc:null,grid:{show:true,size:50,scale:1.5},weather:"",initiative:{list:[],round:1,currentIdx:0},activity:{paused:false,scores:{}},inspiration:{},chat:[],tokens:[],tokenLibrary:[]};updateState();}}
        async function initMic(){try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ac=new AudioContext(),an=ac.createAnalyser();ac.createMediaStreamSource(s).connect(an);an.fftSize=512;const d=new Uint8Array(an.frequencyBinCount);const l=()=>{if(!gameState.activity.paused){an.getByteFrequencyData(d);let sm=0;for(let x of d)sm+=x;if(sm/d.length>15)localSpeechTime+=0.1}setTimeout(()=>requestAnimationFrame(l),100)};l();setInterval(()=>{if(localSpeechTime>0){gameState.activity.scores[currentUser]=localSpeechTime;db.collection('rooms').doc(currentRoom).update({[`activity.scores.${currentUser}`]:localSpeechTime})}},3000)}catch(e){console.log(e)}}

        function openSheet(id) { activeTokenId=id; const t=gameState.tokens.find(x=>x.id===id); if(!t.stats)t.stats={}; if(!t.meta)t.meta={align:"", traits:['','','']}; if(!t.statuses)t.statuses=[]; document.getElementById('char-sheet-modal').style.display='flex'; document.getElementById('sheet-name').innerText=(t.name||t.owner).toUpperCase(); document.getElementById('sheet-token-name').value=t.name||""; document.getElementById('sheet-token-scale').value=t.scale||1; document.getElementById('sheet-align').value=t.meta.align||""; const ts=document.querySelectorAll('.trait-select'); ts.forEach((s,i)=>s.value=t.meta.traits[i]||""); if(isGM){document.getElementById('gm-vision').value=t.vision||10;document.getElementById('btn-gm-pos').style.background=t.locked?"var(--accent-red)":"#333";renderStatusGrid(t);} sheetLocked=false; toggleLock(); toggleLock(); renderStats(t); }
        function closeSheet(){document.getElementById('char-sheet-modal').style.display='none';updateState()}
        function saveSheetMeta(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.name=document.getElementById('sheet-token-name').value;t.scale=parseFloat(document.getElementById('sheet-token-scale').value);t.meta.align=document.getElementById('sheet-align').value;const ts=document.querySelectorAll('.trait-select');t.meta.traits=[ts[0].value,ts[1].value,ts[2].value];updateState()}
        function renderStatusGrid(t){const g=document.getElementById('status-grid');g.innerHTML="";CONDITIONS.forEach(c=>{const a=t.statuses.includes(c);const b=document.createElement('button');b.className=`status-btn ${a?'active-status':''}`;b.innerText=c;b.onclick=()=>{if(a)t.statuses=t.statuses.filter(x=>x!==c);else t.statuses.push(c);renderStatusGrid(t);updateState()};g.appendChild(b)})}
        function gmDeleteToken(){if(confirm("Sil?")){gameState.tokens=gameState.tokens.filter(x=>x.id!==activeTokenId);closeSheet();updateState()}}
        function gmTogglePosLock(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.locked=!t.locked;openSheet(activeTokenId);updateState()}
        function gmUpdateToken(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.vision=parseFloat(document.getElementById('gm-vision').value)||10;updateState()}
        function renderStats(t){const al=document.getElementById('attr-list'), sl=document.getElementById('skill-list'); al.innerHTML=""; sl.innerHTML=""; const cr=(k,tr,tp)=>{const s=getS(t,k);return `<div class="stat-row"><span style="color:var(--gold-text);font-size:0.75rem">${tr}</span><div class="input-group"><input type="number" min="1" max="5" value="${s.b}" onchange="upS('${k}',this.value,'${s.a}')"></div><div class="input-group"><input type="number" min="0" value="${s.a}" onchange="upS('${k}','${s.b}',this.value)"></div><button class="stat-btn-locked" onclick="selS('${k}','${tp}',this)">${tr}: ${s.b} + ${s.a}</button></div>`}; for(let k in ATTRS)al.innerHTML+=cr(k,ATTRS[k],'attr'); for(let k in SKILLS)sl.innerHTML+=cr(k,SKILLS[k],'skill');}
        window.upS=function(k,b,a){setS(gameState.tokens.find(x=>x.id===activeTokenId),k,b,a)}
        window.selS=function(k,tp,btn){if(!sheetLocked)return;if(tp==='attr'){selAttr=(selAttr===k)?null:k;document.querySelectorAll('#attr-list .stat-btn-locked').forEach(b=>b.classList.remove('selected'));if(selAttr)btn.classList.add('selected')}else{selSkill=(selSkill===k)?null:k;document.querySelectorAll('#skill-list .stat-btn-locked').forEach(b=>b.classList.remove('selected'));if(selSkill)btn.classList.add('selected')}document.getElementById('sheet-status').innerText=`Seçim: ${selAttr?ATTRS[selAttr]:'-'} + ${selSkill?SKILLS[selSkill]:'-'}`}
        function toggleLock(){sheetLocked=!sheetLocked;const b=document.querySelector('.sheet-body'),btn=document.getElementById('btn-lock');if(sheetLocked){b.classList.add('locked-mode');btn.innerText="AÇ";renderStats(gameState.tokens.find(x=>x.id===activeTokenId))}else{b.classList.remove('locked-mode');btn.innerText="KİLİTLE";selAttr=null;selSkill=null}}
        function getS(t,k){const v=t.stats[k]||"1,0";const p=v.split(',');return{b:parseInt(p[0])||1,a:parseInt(p[1])||0}}
        function setS(t,k,b,a){t.stats[k]=`${b},${a}`}
        function rollStats(){if(!selAttr&&!selSkill)return;const t=gameState.tokens.find(x=>x.id===activeTokenId);let b=0,a=0;if(selAttr){const s=getS(t,selAttr);b+=s.b;a+=s.a}if(selSkill){const s=getS(t,selSkill);b+=s.b;a+=s.a}let res=rollD(b);let total=res.h+a;
        const html=`<div style="border-left:3px solid var(--accent-green);padding-left:5px"><b>${(t.name||t.owner).toUpperCase()}</b><br>Zar: [${res.d}]<br>Sonuç: ${res.h}+${a}=<b>${total}</b><div class="log-actions"><button onclick="actPush(${b},${a},${total})">ZORLA</button><button onclick="actInsp(${b},${a})">İLHAM</button><button onclick="actCombo(${b},${a})">ZORLA & İLHAM</button></div></div>`;
        addLog(html); gameState.chat.push({u:"SİSTEM",t:html,type:'html'}); updateState();}
        window.actPush = function(base, auto, prevTotal) { let prevHits = prevTotal - auto; let fails = base - prevHits; if(fails <= 0) return alert("Zorlanacak zar yok!"); let res = rollD(fails); let newTotal = prevTotal + res.h; const html=`<div style="border-left:2px dashed #aaa; padding-left:5px; margin-top:5px;"><i>Zorlama...</i> [${res.d}] (+${res.h})<br>YENİ SONUÇ: <b>${newTotal}</b><div class="log-actions"><button onclick="actInsp(${base}, ${auto})">İLHAM</button></div></div>`; addLog(html); gameState.chat.push({u:"SİSTEM", t:html, type:'html'}); updateState(); }
        window.actInsp = function(base, auto) { useInsp(1); let res = rollD(base); let total = res.h + auto; const html=`<div style="border-top:1px solid #555; padding-top:5px; margin-top:5px;"><b>✨ İLHAM</b> (Harcanan: 1)<br>Yeni Atış: [${res.d}]<br>Sonuç: <b>${total}</b><div class="log-actions"><button onclick="actPush(${base}, ${auto}, ${total})">ZORLA</button></div></div>`; addLog(html); gameState.chat.push({u:"SİSTEM", t:html, type:'html'}); updateState(); }
        window.actCombo = function(base, auto) { const target = parseInt(prompt("Hedef?", 4)); if(!target) return; const limit = parseInt(prompt("Limit?", 5)); if(!limit) return; let spent=0, bestTotal=0, logTxt = ""; while(spent < limit) { spent++; let r1 = rollD(base); let hits = r1.h; let fails = base - hits; let pushed = 0; if(fails > 0) { let r2 = rollD(fails); pushed = r2.h; } let total = hits + pushed + auto; logTxt += `[#${spent}: ${total}] `; if(total >= target) { bestTotal=total; break; } if(total > bestTotal) bestTotal=total; } useInsp(spent); const html=`<div style="background:rgba(200,150,0,0.1); padding:5px; margin-top:5px;"><b>🔥 COMBO</b> (Harc: ${spent})<br><small>${logTxt}</small><br>SONUÇ: <b style="color:${bestTotal>=target?'#2ecc71':'#e74c3c'}">${bestTotal}</b></div>`; addLog(html); gameState.chat.push({u:"SİSTEM", t:html, type:'html'}); updateState(); }
        function rollD(n) { let h=0, d=[]; for(let i=0;i<n;i++){let r=Math.floor(Math.random()*6)+1; d.push(r); if(r===6)h++;} return {h,d}; }
        function useInsp(n) { if(!gameState.inspiration[currentUser]) gameState.inspiration[currentUser]=0; gameState.inspiration[currentUser]+=n; }

    </script>
</body>
</html>
