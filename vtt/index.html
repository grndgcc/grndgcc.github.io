<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturMaguntia&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(12, 12, 16, 0.96);
            --glass-border: rgba(184, 134, 11, 0.6);
            --gold-text: #eebb66;
            --text-main: #dddddd;
            --accent-red: #8b0000;
            --accent-green: #1b4d2e;
            --blur-amt: 20px;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0; padding: 0; font-family: 'Cinzel', serif;
            background-color: var(--bg-color); color: var(--text-main);
            overflow: hidden; display: flex; height: 100vh; width: 100vw;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png'), radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            overscroll-behavior: none;
        }

        h1, h2, h3, h4 { font-family: 'UnifrakturMaguntia', cursive; letter-spacing: 1px; font-weight: normal; }
        
        input, select, textarea {
            background: rgba(0,0,0,0.5); color: #fff; 
            border: 1px solid #555; padding: 8px; border-radius: 4px; 
            width: 100%; font-family: 'Lato', sans-serif; text-align: center;
        }
        input:focus { outline: none; border-color: var(--gold-text); box-shadow: 0 0 8px rgba(238, 187, 102, 0.3); }

        /* UI PANELS */
        .glass-panel {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            color: var(--text-main); pointer-events: auto; backdrop-filter: blur(var(--blur-amt));
        }

        button {
            background: linear-gradient(to bottom, #2b2b2b, #151515);
            border: 1px solid var(--glass-border); color: var(--gold-text);
            padding: 6px 12px; border-radius: 4px; cursor: pointer;
            font-family: 'Cinzel', serif; font-weight: bold; font-size: 0.75rem;
            text-transform: uppercase; transition: 0.2s; text-shadow: 1px 1px 2px black;
        }
        button:hover { background: #3a3a3a; border-color: #fff; text-shadow: 0 0 8px var(--gold-text); }
        button:active { transform: translateY(1px); }
        button.active { background: var(--accent-red); color: white; border-color: white; }

        /* DOCK */
        #ui-dock {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; padding: 10px 20px; z-index: 2000;
            border-radius: 40px; border: 1px solid var(--glass-border);
            background: rgba(5, 5, 5, 0.95); box-shadow: 0 0 20px black;
        }
        .dock-btn {
            width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; border: 1px solid #444; background: #111; position: relative;
        }
        .dock-btn:hover { transform: scale(1.1); z-index: 10; border-color: var(--gold-text); }
        .dock-btn.active-mode { border-color: var(--gold-text); background: var(--accent-red); }

        /* PANELS */
        #sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 360px; z-index: 1500;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            transform: translateX(-380px); transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            background: rgba(8, 8, 10, 0.98); border-right: 2px solid var(--glass-border);
        }
        #sidebar.open { transform: translateX(0); }
        
        .float-panel {
            position: fixed; z-index: 500; padding: 10px; display: none; flex-direction: column;
            min-width: 260px; max-width: 400px; max-height: 80vh;
        }
        .float-panel.visible { display: flex; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        .float-header { 
            font-family: 'UnifrakturMaguntia', cursive; font-size: 1.3rem; color: var(--gold-text); 
            border-bottom: 1px solid #555; padding-bottom: 8px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; cursor: move;
        }

        #panel-initiative { top: 80px; right: 20px; }
        #panel-music { top: 80px; left: 380px; width: 300px; }
        #panel-wiki { top: 50px; left: 50%; transform: translateX(-50%); width: 600px; height: 700px; }
        #panel-dice { bottom: 100px; right: 20px; width: 300px; }
        #panel-chat { bottom: 100px; left: 20px; width: 320px; height: 400px; }

        .list-container { flex-grow: 1; overflow-y: auto; font-size: 0.9rem; scrollbar-width: thin; scrollbar-color: var(--glass-border) transparent; }
        .list-item { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer;}
        .list-item:hover { background: rgba(255,255,255,0.05); }
        .list-item.active { background: rgba(184, 134, 11, 0.2); border-left: 3px solid var(--gold-text); }

        /* GAME AREA */
        #game-area { position: absolute; top:0; left:0; width:100%; height:100%; overflow: hidden; cursor: default; z-index: 0; background: #000; }
        #map-container { position: absolute; top:0; left:0; transform-origin: 0 0; }
        #game-map { position: absolute; z-index: 1; pointer-events: none; }
        canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
        #grid-canvas { z-index: 2; }
        #fog-canvas { z-index: 3; }
        #ruler-canvas { z-index: 20; }
        
        /* 3D DICE OVERLAY */
        #dice-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 3000;
            display: none; justify-content: center; align-items: center; perspective: 1000px;
        }
        .cube {
            width: 100px; height: 100px; position: relative; transform-style: preserve-3d;
            animation: rotateDice 2s ease-out forwards;
        }
        .face {
            position: absolute; width: 100px; height: 100px; background: rgba(139, 0, 0, 0.9);
            border: 2px solid gold; line-height: 100px; text-align: center; font-size: 40px; color: white; font-weight: bold;
        }
        .front  { transform: rotateY(0deg) translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }
        @keyframes rotateDice {
            0% { transform: rotateX(0) rotateY(0); }
            100% { transform: rotateX(720deg) rotateY(720deg); }
        }

        /* TOKENS */
        .token {
            position: absolute; z-index: 10; border-radius: 50%;
            border: 2px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.8);
            background-size: cover; background-position: center; transition: border-color 0.2s;
        }
        .token.my-token { border-color: var(--accent-green); cursor: grab; }
        .token.other-token { border-color: var(--accent-red); }
        .token.invisible { opacity: 0.5; filter: grayscale(1); border-style: dashed; } /* GM view */
        
        .token-name {
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 2px 6px; border-radius: 4px;
            font-size: 11px; white-space: nowrap; pointer-events: none; color: var(--gold-text);
            border: 1px solid #444; z-index: 20;
        }
        .token-statuses { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; pointer-events: none; z-index: 15; }
        .status-badge { background: #000; color: #f1c40f; padding: 1px 4px; border-radius: 3px; font-size: 8px; border: 1px solid #555; }
        .token.is-dead::after { content: '☠'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: #8b0000; text-shadow: 0 0 10px black; }

        /* CONTEXT MENU */
        #context-menu {
            display: none; position: absolute; z-index: 4000; width: 150px;
            background: #111; border: 1px solid var(--gold-text); border-radius: 5px;
        }
        #context-menu button { width: 100%; text-align: left; background: transparent; border: none; padding: 8px; }
        #context-menu button:hover { background: var(--accent-red); color: white; }

        /* WIKI */
        .wiki-content img { max-width: 100%; border-radius: 5px; margin: 10px 0; border: 1px solid #444; }
        .wiki-page-item { padding: 8px; border-bottom: 1px solid #333; cursor: pointer; color: #aaa; }
        .wiki-page-item:hover { color: white; background: #222; }
        .wiki-page-item.active { color: var(--gold-text); font-weight: bold; background: #222; }

        /* MEDIA PLAYERS HIDDEN */
        #media-container { display: none; }

        /* MOBILE */
        @media (max-width: 768px) {
            #ui-dock { width: 95%; justify-content: space-between; padding: 5px; }
            .dock-btn { width: 38px; height: 38px; font-size: 1rem; }
            #sidebar { width: 100%; }
            .float-panel { width: 95% !important; left: 2.5% !important; top: 60px !important; max-height: 60vh; }
            #char-sheet-modal { width: 100%; height: 100%; }
        }
        .gm-only { display: none; }
    </style>
</head>

        let activeTokenId=null, attachMode=false, selAttr=null, selSkill=null;
        let rulerMode=false, rulerStartPoint=null, tempStart=null, isDraggingRuler=false;
        let mapTransform={x:0, y:0, scale:1}; showTooltips=true;
        let jitsiApi=null; let player=null; // Youtube Player Placeholder

        // --- INIT ---
        async function attemptLogin() {
            const room = document.getElementById('room-input').value.trim();
            const role = document.getElementById('role-select').value;
            const pass = document.getElementById('password-input').value;
            if(!room) return alert("Oda adı girin.");
            document.getElementById('loading-overlay').style.display='flex';
            try {
                const ref = db.collection('rooms').doc(room);
                const doc = await ref.get();
                if(!doc.exists) {
                    if(pass !== CREDENTIALS[role]) throw new Error("Yeni oda için şifre: "+CREDENTIALS[role]);
                    await ref.set({ users:CREDENTIALS, mapSrc:null, grid:{show:true,size:50,scale:1.5}, initiative:{list:[],round:1,currentIdx:0}, music:{list:[],current:null,loop:false}, wiki:[], chat:[], tokens:[], voiceActive:false });
                } else if(doc.data().users[role] !== pass) throw new Error("Hatalı Şifre");
                
                currentRoom=room; currentUser=role; isGM=role.startsWith('gm');
                document.getElementById('login-screen').style.display='none';
                if(isGM) document.querySelectorAll('.gm-only').forEach(e=>e.style.display='block');
                
                const opts = `<option value="">Özellik...</option>` + TRAITS.map(t=>`<option>${t}</option>`).join('');
                document.querySelectorAll('.trait-select').forEach(s=>s.innerHTML=opts);

                ref.onSnapshot(snap => { 
                    if(snap.exists) { gameState=snap.data(); renderAll(); checkVoice(); }
                });
                initZoomPan();
            } catch(e) { alert(e.message); } finally { document.getElementById('loading-overlay').style.display='none'; }
        }
        function updateState() { if(currentRoom) db.collection('rooms').doc(currentRoom).update(gameState).catch(console.error); }

        // --- RENDER ---
        function renderAll() { renderMap(); renderInit(); renderMusic(); renderWiki(); renderChat(); if(!isGM){ document.getElementById('grid-size').value=gameState.grid.size; document.getElementById('grid-scale').value=gameState.grid.scale; } }

        // --- MAP & TOKENS ---
        function renderMap() {
            const m=document.getElementById('game-map');
            if(gameState.mapSrc && m.src!==gameState.mapSrc) { m.src=gameState.mapSrc; m.onload=()=>{resizeCvs();drawGrid();drawFog();}; m.style.display='block'; }
            else if(!gameState.mapSrc) m.style.display='none'; else { drawGrid(); drawFog(); }

            const mc=document.getElementById('map-container');
            document.querySelectorAll('.token').forEach(e=>e.remove());
            gameState.tokens.forEach(t=>{
                // Visibility Check
                if(!t.visible && !isGM) return;

                const size=70*(t.scale||1);
                const el=document.createElement('div'); el.className='token';
                el.style.width=size+'px'; el.style.height=size+'px';
                el.style.left=t.x+'px'; el.style.top=t.y+'px';
                el.style.backgroundImage=`url(${t.imgSrc})`;
                if(!t.visible && isGM) el.classList.add('invisible');

                const isOwn = t.owner===currentUser || isGM;
                if(isOwn) { el.classList.add('my-token'); addDrag(el,t.id);
                    const g=document.createElement('div'); g.className='token-gear'; g.innerHTML='⚙️';
                    g.onclick=e=>{e.stopPropagation(); openSheet(t.id);}
                    g.onmousedown=e=>e.stopPropagation(); el.appendChild(g);
                } else el.classList.add('other-token');

                if(t.statuses?.includes("Öldü")) el.classList.add('is-dead');
                const n=document.createElement('div'); n.className='token-name'; n.innerText=(t.name||t.owner).toUpperCase(); el.appendChild(n);
                
                // Context Menu
                el.addEventListener('contextmenu', e => {
                    e.preventDefault(); 
                    if(isGM) {
                        activeTokenId=t.id;
                        const cm = document.getElementById('context-menu');
                        cm.style.display='block'; cm.style.left=e.pageX+'px'; cm.style.top=e.pageY+'px';
                    }
                });
                
                // Mounting
                el.addEventListener('click', e => {
                    if(attachMode && activeTokenId && activeTokenId !== t.id) {
                        const child = gameState.tokens.find(x=>x.id===activeTokenId);
                        if(child) { child.attachedTo = t.id; alert("Bağlandı."); updateState(); }
                        attachMode=false; document.getElementById('btn-attach').innerText="🔗 BAĞLA";
                    }
                });

                if(showTooltips) {
                    const tip=document.createElement('div'); tip.className='token-tooltip';
                    const traits=t.meta?.traits?t.meta.traits.filter(x=>x).join(', '):'-';
                    tip.innerHTML=`<div class="tt-header">${(t.name||"Adsız")}</div><div class="tt-row"><span>Yön:</span> <span>${t.meta?.align||"-"}</span></div><div class="tt-row"><span>Kişilik:</span> <span style="font-size:0.65rem">${traits}</span></div>`;
                    el.appendChild(tip);
                }
                mc.appendChild(el);
            });
        }

        function addDrag(el, id) {
            let start=null, initPos=null; 
            const startD=(x,y)=>{if(rulerMode)return false;start={x,y};initPos={left:parseInt(el.style.left||0),top:parseInt(el.style.top||0)};return true;}
            const moveD=(x,y)=>{
                if(!start)return;
                let dx = (x-start.x)/mapTransform.scale; let dy = (y-start.y)/mapTransform.scale;
                el.style.left=(initPos.left+dx)+'px'; el.style.top=(initPos.top+dy)+'px';
            }
            const endD=(x,y)=>{
                if(!start)return; 
                let dx = (x-start.x)/mapTransform.scale; let dy = (y-start.y)/mapTransform.scale;
                start=null;
                const t=gameState.tokens.find(x=>x.id===id);
                if(t){ 
                    t.x += dx; t.y += dy;
                    // Move Attached Tokens
                    gameState.tokens.filter(k=>k.attachedTo===t.id).forEach(k=>{k.x+=dx; k.y+=dy;});
                    updateState(); 
                }
            }
            el.onmousedown=e=>{if(e.button===0&&startD(e.clientX,e.clientY)){const mm=ev=>moveD(ev.clientX,ev.clientY);const mu=ev=>{endD(ev.clientX,ev.clientY);window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu)}};
            el.ontouchstart=e=>{startD(e.touches[0].clientX,e.touches[0].clientY)};
            el.ontouchmove=e=>{if(start){e.preventDefault();moveD(e.touches[0].clientX,e.touches[0].clientY)}};
            el.ontouchend=e=>{endD(e.changedTouches[0].clientX,e.changedTouches[0].clientY)};
        }

        // --- CONTEXT MENU ---
        function toggleVisibility() {
            const t = gameState.tokens.find(x=>x.id===activeTokenId);
            if(t) { t.visible = !t.visible; updateState(); }
            closeContextMenu();
        }
        function closeContextMenu() { document.getElementById('context-menu').style.display='none'; }
        document.addEventListener('click', e => { if(!e.target.closest('#context-menu')) closeContextMenu(); });

        // --- VOICE CHAT (JITSI) ---
        function toggleVoice() { 
            if(!isGM) return alert("Sadece GM başlatabilir.");
            gameState.voiceActive = !gameState.voiceActive;
            updateState();
        }
        function checkVoice() {
            if(gameState.voiceActive && !jitsiApi) {
                const domain = "meet.jit.si";
                const options = {
                    roomName: "ikilievren_vtt_" + currentRoom,
                    width: 1, height: 1, parentNode: document.querySelector('#voice-chat-frame'),
                    configOverwrite: { startWithAudioMuted: false, startWithVideoMuted: true },
                    interfaceConfigOverwrite: { TOOLBAR_BUTTONS: ['microphone'] }
                };
                jitsiApi = new JitsiMeetExternalAPI(domain, options);
                document.getElementById('btn-voice').classList.add('active-mode');
            } else if(!gameState.voiceActive && jitsiApi) {
                jitsiApi.dispose(); jitsiApi=null;
                document.getElementById('btn-voice').classList.remove('active-mode');
            }
        }

        // --- MUSIC PLAYER ---
        function addMusic() {
            const url = document.getElementById('music-url').value;
            if(url) { gameState.music.list.push(url); updateState(); document.getElementById('music-url').value=""; }
        }
        function renderMusic() {
            const l = document.getElementById('music-list'); l.innerHTML="";
            gameState.music.list.forEach((url, i) => {
                const div = document.createElement('div'); div.className = "list-item " + (gameState.music.current===url?'active':'');
                div.innerText = "Parça " + (i+1);
                div.onclick = () => { gameState.music.current = url; updateState(); playMusic(url); };
                l.appendChild(div);
            });
            document.getElementById('btn-loop').innerText = gameState.music.loop ? "DÖNGÜ: AÇIK" : "DÖNGÜ: KAPALI";
        }
        function toggleLoop() { gameState.music.loop = !gameState.music.loop; updateState(); }
        function stopMusic() { gameState.music.current = null; updateState(); playMusic(null); }
        
        function playMusic(url) {
            const ytDiv = document.getElementById('youtube-player');
            const audio = document.getElementById('bg-music-player');
            ytDiv.innerHTML = ""; audio.pause();
            
            if(!url) return;

            if(url.includes("youtube.com") || url.includes("youtu.be")) {
                let vID = url.split('v=')[1];
                if(!vID) vID = url.split('/').pop();
                const amp = vID.indexOf('&'); if(amp!=-1) vID = vID.substring(0,amp);
                const loopStr = gameState.music.loop ? `&loop=1&playlist=${vID}` : "";
                ytDiv.innerHTML = `<iframe width="1" height="1" src="https://www.youtube.com/embed/${vID}?autoplay=1${loopStr}" frameborder="0" allow="autoplay"></iframe>`;
            } else {
                audio.src = url; audio.loop = gameState.music.loop; audio.play().catch(e=>console.log("Audio Play Error", e));
            }
        }

        // --- WIKI ---
        function saveWikiPage() {
            const t = document.getElementById('wiki-title').value;
            const c = document.getElementById('wiki-text').value;
            const b = document.getElementById('wiki-bgm').value;
            if(!t) return;
            const exist = gameState.wiki.find(x=>x.title===t);
            if(exist) { exist.content=c; exist.bgm=b; }
            else { gameState.wiki.push({id:Date.now(), title:t, content:c, bgm:b}); }
            updateState();
        }
        function renderWiki() {
            const nav = document.getElementById('wiki-nav'); nav.innerHTML="";
            gameState.wiki.forEach(p => {
                const div = document.createElement('div'); div.className="wiki-page-item"; div.innerText=p.title;
                div.onclick = () => showWikiPage(p);
                nav.appendChild(div);
            });
        }
        function showWikiPage(p) {
            const b = document.getElementById('wiki-body');
            let html = `<h3>${p.title}</h3>`;
            // Image parsing
            const parts = p.content.split('\n');
            parts.forEach(line => {
                if(line.match(/\.(jpeg|jpg|gif|png)$/) != null) html += `<img src="${line}">`;
                else html += `<p>${line}</p>`;
            });
            b.innerHTML = html;
            if(p.bgm) playMusic(p.bgm); // Optional: Wiki music overrides main music
        }

        // --- 3D DICE ---
        function roll3D(sides) {
            const res = Math.floor(Math.random()*sides)+1;
            const ov = document.getElementById('dice-overlay');
            const r = document.getElementById('dice-result');
            ov.style.display = 'flex';
            r.innerText = "";
            
            // Re-trigger animation
            const cube = document.getElementById('dice-cube');
            cube.style.animation = 'none';
            cube.offsetHeight; /* trigger reflow */
            cube.style.animation = 'rotateDice 1s ease-out forwards';

            setTimeout(() => {
                r.innerText = res;
                addLog(`Zar: d${sides} -> <b>${res}</b>`);
                setTimeout(() => { ov.style.display='none'; }, 1000);
            }, 1000);
        }

        // --- SHEET LOGIC ---
        function openSheet(id) {
            activeTokenId=id; const t=gameState.tokens.find(x=>x.id===id);
            if(!t.stats)t.stats={}; if(!t.meta)t.meta={align:"", traits:['','','']};
            if(typeof t.visible === 'undefined') t.visible = true;
            document.getElementById('char-sheet-modal').style.display='flex';
            document.getElementById('sheet-name').innerText=(t.name||t.owner).toUpperCase();
            document.getElementById('sheet-token-name').value=t.name||"";
            document.getElementById('sheet-token-scale').value=t.scale||1;
            const ts=document.querySelectorAll('.trait-select'); ts.forEach((s,i)=>s.value=t.meta.traits[i]||"");
            if(isGM) renderStatusGrid(t);
            renderStats(t);
        }
        function closeSheet(){document.getElementById('char-sheet-modal').style.display='none';updateState()}
        function attachTokenMode() { attachMode=true; document.getElementById('btn-attach').innerText="SEÇ (Haritadan)"; closeSheet(); }
        function detachTokens() { 
            gameState.tokens.filter(x=>x.attachedTo===activeTokenId).forEach(x=>x.attachedTo=null); 
            const t=gameState.tokens.find(x=>x.id===activeTokenId); if(t) t.attachedTo=null;
            alert("Bağlar çözüldü."); updateState(); 
        }
        function saveSheetMeta(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.name=document.getElementById('sheet-token-name').value;t.scale=parseFloat(document.getElementById('sheet-token-scale').value);const ts=document.querySelectorAll('.trait-select');t.meta.traits=[ts[0].value,ts[1].value,ts[2].value];updateState()}
        function renderStatusGrid(t){const g=document.getElementById('status-grid');g.innerHTML="";CONDITIONS.forEach(c=>{const a=t.statuses?.includes(c);const b=document.createElement('button');b.className=`status-btn ${a?'active-status':''}`;b.innerText=c;b.onclick=()=>{if(!t.statuses)t.statuses=[]; if(a)t.statuses=t.statuses.filter(x=>x!==c);else t.statuses.push(c);renderStatusGrid(t);updateState()};g.appendChild(b)})}
        function renderStats(t){const al=document.getElementById('attr-list'), sl=document.getElementById('skill-list'); al.innerHTML=""; sl.innerHTML=""; const cr=(k,tr,tp)=>{const s=t.stats[k]||"1,0";const [b,a]=s.split(','); return `<div class="stat-row"><span style="color:var(--gold-text);font-size:0.75rem">${tr}</span><div class="input-group"><input type="number" min="1" max="5" value="${b}" onchange="upS('${k}',this.value,'${a}')"></div><div class="input-group"><input type="number" min="0" value="${a}" onchange="upS('${k}','${b}',this.value)"></div><button class="stat-btn-locked" onclick="selS('${k}','${tp}',this)">${tr}: ${b} + ${a}</button></div>`}; for(let k in ATTRS)al.innerHTML+=cr(k,ATTRS[k],'attr'); for(let k in SKILLS)sl.innerHTML+=cr(k,SKILLS[k],'skill');}
        window.upS=function(k,b,a){const t=gameState.tokens.find(x=>x.id===activeTokenId); t.stats[k]=`${b},${a}`; updateState();}
        window.selS=function(k,tp,btn){if(tp==='attr'){selAttr=(selAttr===k)?null:k;document.querySelectorAll('#attr-list .stat-btn-locked').forEach(b=>b.classList.remove('selected'));if(selAttr)btn.classList.add('selected')}else{selSkill=(selSkill===k)?null:k;document.querySelectorAll('#skill-list .stat-btn-locked').forEach(b=>b.classList.remove('selected'));if(selSkill)btn.classList.add('selected')}document.getElementById('sheet-status').innerText=`Seçim: ${selAttr?ATTRS[selAttr]:'-'} + ${selSkill?SKILLS[selSkill]:'-'}`}
        function rollStats(){if(!selAttr&&!selSkill)return;const t=gameState.tokens.find(x=>x.id===activeTokenId);let b=0,a=0;if(selAttr){const s=t.stats[selAttr]||"1,0";b+=parseInt(s.split(',')[0]);a+=parseInt(s.split(',')[1])}if(selSkill){const s=t.stats[selSkill]||"1,0";b+=parseInt(s.split(',')[0]);a+=parseInt(s.split(',')[1])}let r=[],h=0;for(let i=0;i<b;i++){let v=Math.floor(Math.random()*6)+1;r.push(v);if(v===6)h++}const tot=h+a;const htm=`<div style="border-left:3px solid var(--accent-green);padding-left:5px"><b>${(t.name||t.owner).toUpperCase()}</b><br>Zar: [${r}]<br>Sonuç: ${h}+${a} (Oto)=<b style="color:var(--gold-text)">${tot} BAŞARI</b></div>`;addLog(htm);gameState.chat.push({u:"SİSTEM",t:htm,type:'html'});updateState();}

        // --- UTILS ---
        function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
        function togglePanel(id){document.getElementById(id).classList.toggle('visible')}
        function toggleTooltips(){showTooltips=document.getElementById('show-tooltips').checked; renderMap();}
        function addLog(h){const c=document.getElementById('log-content');const d=document.createElement('div');d.className='log-entry';d.innerHTML=h;c.prepend(d)}
        function clearLog(){document.getElementById('log-content').innerHTML=""}
        function resizeCvs(){const i=document.getElementById('game-map'),w=i.naturalWidth||800,h=i.naturalHeight||600;['grid-canvas','fog-canvas','ruler-canvas'].forEach(id=>{const c=document.getElementById(id);c.width=w;c.height=h})}
        function clearCvs(){['grid-canvas','fog-canvas'].forEach(id=>document.getElementById(id).getContext('2d').clearRect(0,0,9999,9999))}
        function drawGrid(){const c=document.getElementById('grid-canvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!gameState.grid.show)return;x.beginPath();x.strokeStyle='rgba(255,255,255,0.1)';for(let i=0;i<=c.width;i+=gameState.grid.size){x.moveTo(i,0);x.lineTo(i,c.height)}for(let j=0;j<=c.height;j+=gameState.grid.size){x.moveTo(0,j);x.lineTo(c.width,j)}x.stroke()}
        function drawFog(){const c=document.getElementById('fog-canvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='black';x.globalAlpha=isGM?0.4:1.0;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-out';x.globalAlpha=1.0;gameState.tokens.filter(t=>isGM||t.owner===currentUser).forEach(t=>{const cx=t.x+35*(t.scale||1),cy=t.y+35*(t.scale||1),rad=300;const g=x.createRadialGradient(cx,cy,rad*0.5,cx,cy,rad);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');x.beginPath();x.arc(cx,cy,rad,0,Math.PI*2);x.fillStyle=g;x.fill()});x.globalCompositeOperation='source-over'}
        function updateGrid(){if(!isGM)return;gameState.grid.size=parseInt(document.getElementById('grid-size').value)||50;gameState.grid.scale=parseFloat(document.getElementById('grid-scale').value)||1.5;gameState.grid.show=document.getElementById('grid-show').checked;updateState();}
        function setMapURL(){const u=document.getElementById('map-url').value;if(u){gameState.mapSrc=u;updateState()}}
        function addTokenBulk(){const t=document.getElementById('token-url-area').value.split('\n');t.forEach(u=>{if(u)gameState.tokens.push({id:Date.now()+Math.random(),owner:currentUser,x:100,y:100,imgSrc:u,scale:1,stats:{},meta:{align:"",traits:['','','']},vision:10,locked:false,statuses:[],visible:true})});updateState()}
        function resetAll(){if(isGM&&confirm("Sil?")){gameState={mapSrc:null,grid:{show:true,size:50,scale:1.5},initiative:{list:[],round:1,currentIdx:0},music:{list:[],current:null,loop:false},wiki:[],chat:[],tokens:[],voiceActive:false};updateState()}}
        
        // --- ZOOM & RULER & PAN (Base logic) ---
        function initZoomPan(){
            const area=document.getElementById('game-area'), cont=document.getElementById('map-container');
            let mapScale=1, isPanning=false, startX=0, startY=0, mapX=0, mapY=0;
            const apply=()=>{cont.style.transform=`translate(${mapX}px, ${mapY}px) scale(${mapScale})`;}
            area.addEventListener('wheel',e=>{e.preventDefault();const d=e.deltaY>0?0.9:1.1;mapScale=Math.max(0.1,mapScale*d);apply()});
            area.addEventListener('mousedown',e=>{if(e.button===2){isPanning=true;startX=e.clientX-mapX;startY=e.clientY-mapY}});
            window.addEventListener('mousemove',e=>{if(isPanning){e.preventDefault();mapX=e.clientX-startX;mapY=e.clientY-startY;apply()}});
            window.addEventListener('mouseup',()=>{isPanning=false});
            area.addEventListener('contextmenu',e=>e.preventDefault());
            
            // Ruler
            let rulerMode=false, rStart=null;
            document.getElementById('btn-ruler').onclick=()=>{rulerMode=!rulerMode;document.getElementById('game-area').style.cursor=rulerMode?'crosshair':'default';document.getElementById('ruler-canvas').getContext('2d').clearRect(0,0,9999,9999)};
            area.addEventListener('mousedown',e=>{if(rulerMode&&e.button===0){const r=cont.getBoundingClientRect();rStart={x:(e.clientX-r.left)/mapScale,y:(e.clientY-r.top)/mapScale}}});
            window.addEventListener('mousemove',e=>{if(rulerMode&&rStart){
                const r=cont.getBoundingClientRect(), cx=(e.clientX-r.left)/mapScale, cy=(e.clientY-r.top)/mapScale;
                const ctx=document.getElementById('ruler-canvas').getContext('2d'); ctx.clearRect(0,0,9999,9999);
                ctx.beginPath();ctx.strokeStyle='yellow';ctx.lineWidth=3;ctx.moveTo(rStart.x,rStart.y);ctx.lineTo(cx,cy);ctx.stroke();
                const m=(Math.hypot(cx-rStart.x,cy-rStart.y)/gameState.grid.size)*gameState.grid.scale;
                document.getElementById('ruler-info').style.display='block'; document.getElementById('ruler-info').innerText=m.toFixed(1)+"m";
            }});
            window.addEventListener('mouseup',()=>{if(rulerMode)rStart=null});
        }

    </script>
</body>
</html>
