<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İkili Evren - V4 Efsaneler</title>
    
    <!-- FONTLAR -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=UnifrakturMaguntia&family=Lato:wght@400;700&display=swap" rel="stylesheet">

    <!-- FIREBASE & JITSI & YOUTUBE API -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src='https://meet.jit.si/external_api.js'></script>
    <script src="https://www.youtube.com/iframe_api"></script>

    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(12, 12, 16, 0.96);
            --glass-border: rgba(184, 134, 11, 0.6);
            --gold-text: #eebb66;
            --text-main: #dddddd;
            --accent-red: #8b0000;
            --accent-green: #1b4d2e;
            --blur-amt: 20px;
        }

        * { box-sizing: border-box; touch-action: none; user-select: none; -webkit-user-select: none; }

        body {
            margin: 0; padding: 0; font-family: 'Cinzel', serif;
            background-color: var(--bg-color); color: var(--text-main);
            overflow: hidden; display: flex; height: 100vh; width: 100vw;
            background-image: url('https://www.transparenttextures.com/patterns/dark-matter.png'), radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            overscroll-behavior: none;
        }

        h1, h2, h3, h4, .gothic-title { font-family: 'UnifrakturMaguntia', cursive; letter-spacing: 1px; font-weight: normal; margin:0;}
        
        input, select, textarea {
            background: rgba(0,0,0,0.5); color: #fff; border: 1px solid #555; 
            padding: 8px; border-radius: 4px; width: 100%; font-family: 'Lato', sans-serif; text-align: center;
        }
        input:focus, textarea:focus { outline: none; border-color: var(--gold-text); }

        /* PANELS */
        .glass-panel {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.8);
            color: var(--text-main); pointer-events: auto; backdrop-filter: blur(var(--blur-amt));
        }

        button {
            background: linear-gradient(to bottom, #2b2b2b, #151515); border: 1px solid var(--glass-border); color: var(--gold-text);
            padding: 6px 12px; border-radius: 4px; cursor: pointer; font-family: 'Cinzel', serif; font-weight: bold; font-size: 0.8rem;
            text-transform: uppercase; transition: 0.2s; text-shadow: 1px 1px 2px black;
        }
        button:hover { background: #3a3a3a; border-color: #fff; text-shadow: 0 0 8px var(--gold-text); }
        button:active { transform: translateY(1px); }
        button.active { background: var(--accent-red); color: white; border-color: white; box-shadow: 0 0 15px var(--accent-red); }

        /* DOCK */
        #ui-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; padding: 10px 20px; z-index: 2000;
            border-radius: 40px; border: 1px solid var(--glass-border); background: rgba(5, 5, 5, 0.95);
        }
        .dock-btn {
            width: 45px; height: 45px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; border: 1px solid #444; background: #111;
        }
        .dock-btn:hover { transform: scale(1.1); z-index: 10; border-color: var(--gold-text); }
        .dock-btn.active-mode { border-color: var(--gold-text); background: var(--accent-red); }

        /* SIDEBAR & FLOAT PANELS */
        #sidebar {
            position: fixed; top: 0; left: 0; height: 100%; width: 360px; z-index: 1500; padding: 20px; display: flex; flex-direction: column; gap: 15px;
            transform: translateX(-380px); transition: transform 0.4s; background: rgba(8, 8, 10, 0.98); border-right: 2px solid var(--glass-border);
        }
        #sidebar.open { transform: translateX(0); }
        
        .float-panel {
            position: fixed; z-index: 500; padding: 10px; display: none; flex-direction: column;
            min-width: 260px; max-width: 340px; max-height: 80vh;
        }
        .float-panel.visible { display: flex; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        .float-header { 
            font-family: 'UnifrakturMaguntia', cursive; font-size: 1.3rem; color: var(--gold-text); 
            border-bottom: 1px solid #555; padding-bottom: 8px; margin-bottom: 8px; 
            display: flex; justify-content: space-between; align-items: center; cursor: move;
        }

        /* Panel Locations */
        #panel-initiative { top: 80px; right: 20px; }
        #panel-music { top: 80px; left: 380px; width: 300px; }
        #panel-wiki { top: 50px; left: 50%; transform: translateX(-50%); width: 700px; height: 600px; }
        #panel-dice { bottom: 100px; left: 50%; transform: translateX(-50%); flex-direction: row; gap: 10px; background: transparent; border: none; box-shadow: none; }
        #panel-log { bottom: 100px; right: 20px; width: 340px; height: 350px; }
        #panel-chat { bottom: 100px; left: 20px; width: 320px; height: 400px; }
        #panel-album { top: 100px; left: 100px; width: 600px; height: 500px; }

        .list-container { flex-grow: 1; overflow-y: auto; font-size: 0.9rem; scrollbar-width: thin; }
        .list-item { display: flex; justify-content: space-between; padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .list-item.active { background: rgba(184, 134, 11, 0.2); border-left: 3px solid var(--gold-text); }

        /* WIKI STYLES */
        .wiki-layout { display: grid; grid-template-columns: 200px 1fr; height: 100%; gap: 10px; }
        .wiki-list { border-right: 1px solid #444; overflow-y: auto; }
        .wiki-content { overflow-y: auto; padding: 10px; font-family: 'Lato'; line-height: 1.5; }
        .wiki-content img { max-width: 100%; border: 1px solid var(--gold-text); margin: 10px 0; }
        .wiki-btn { text-align: left; width: 100%; background: transparent; border: none; padding: 5px; color: #aaa; }
        .wiki-btn:hover, .wiki-btn.active { color: var(--gold-text); background: rgba(255,255,255,0.05); }

        /* TOKENS */
        .token {
            position: absolute; z-index: 10; border-radius: 50%;
            border: 2px solid #fff; box-shadow: 0 0 15px rgba(0,0,0,0.8);
            background-size: cover; background-position: center; transition: border-color 0.2s, opacity 0.3s;
        }
        .token.my-token { border-color: var(--accent-green); cursor: grab; box-shadow: 0 0 20px var(--accent-green); }
        .token.other-token { border-color: var(--accent-red); }
        .token.hidden-gm { opacity: 0.5; border-style: dotted; filter: grayscale(1); } /* GM sees hidden tokens */
        
        .token-name {
            position: absolute; bottom: -20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); padding: 2px 6px; border-radius: 4px;
            font-size: 11px; white-space: nowrap; pointer-events: none; color: var(--gold-text);
            font-weight: bold; border: 1px solid #444; z-index: 20; font-family: 'Lato';
        }
        .token.is-dead { filter: grayscale(100%) brightness(40%); }
        .token.is-dead::after { content: '☠'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 40px; color: #8b0000; text-shadow: 0 0 10px black; }

        .token-tooltip {
            position: absolute; bottom: 115%; left: 50%; transform: translateX(-50%);
            background: rgba(5,5,5,0.95); border: 1px solid var(--gold-text);
            padding: 10px; border-radius: 5px; width: 220px; pointer-events: none;
            display: none; z-index: 100; text-align: left; font-size: 0.8rem;
            box-shadow: 0 10px 30px black; font-family: 'Lato', sans-serif;
        }
        .token:hover .token-tooltip { display: block; }

        /* CONTEXT MENU */
        #context-menu {
            position: fixed; z-index: 9999; width: 150px; background: #222; 
            border: 1px solid var(--gold-text); border-radius: 5px; display: none;
            flex-direction: column; box-shadow: 0 5px 15px black;
        }
        #context-menu button { text-align: left; border: none; background: transparent; border-bottom: 1px solid #333; }
        #context-menu button:hover { background: var(--accent-red); color: white; }

        /* 3D DICE VISUAL (CSS Only Implementation for lightweight) */
        .dice-container { perspective: 1000px; display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 6000; pointer-events: none; }
        .cube {
            width: 100px; height: 100px; position: relative; transform-style: preserve-3d;
            animation: spinDice 1.5s ease-out forwards;
        }
        .face { position: absolute; width: 100px; height: 100px; background: rgba(139, 0, 0, 0.9); border: 2px solid var(--gold-text); color: white; font-size: 40px; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .front  { transform: rotateY(0deg) translateZ(50px); }
        .back   { transform: rotateY(180deg) translateZ(50px); }
        .right  { transform: rotateY(90deg) translateZ(50px); }
        .left   { transform: rotateY(-90deg) translateZ(50px); }
        .top    { transform: rotateX(90deg) translateZ(50px); }
        .bottom { transform: rotateX(-90deg) translateZ(50px); }
        @keyframes spinDice { 
            0% { transform: rotateX(0) rotateY(0) rotateZ(0); } 
            100% { transform: rotateX(720deg) rotateY(720deg) rotateZ(360deg); } 
        }

        /* HIDDEN ELEMENTS */
        #voice-chat-frame { position: absolute; top: -9999px; visibility: hidden; }
        #player-mp3 { display: none; }
        #player-yt { display: none; } /* YT Iframe holder */

        @media (max-width: 768px) {
            #ui-dock { width: 98%; padding: 5px; } .dock-btn { width: 38px; height: 38px; font-size: 1rem; }
            .float-panel { width: 95% !important; left: 2.5% !important; top: 60px !important; max-height: 50vh; }
            #panel-wiki { height: 70vh; } .wiki-layout { grid-template-columns: 100px 1fr; }
        }
        .gm-only { display: none; }
    </style>
</head>
<body>

    <div id="loading-overlay" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;justify-content:center;align-items:center;color:var(--gold-text);">
        <div style="font-size:2rem;">⚔️ YÜKLENİYOR...</div>
    </div>

    <!-- AUDIO ELEMENTS -->
    <div id="voice-chat-frame"></div>
    <audio id="audio-player"></audio> <!-- MP3 -->
    <div id="yt-player-container" style="position:absolute; top:-9999px;"></div> <!-- Youtube -->

    <!-- LOGIN -->
    <div id="login-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#050505;z-index:9999;display:flex;justify-content:center;align-items:center;">
        <div class="glass-panel" style="padding:40px; text-align:center; width:300px; border:2px solid var(--gold-text);">
            <h1 class="gothic-title" style="color:var(--gold-text); font-size:2rem; margin-bottom:10px;">İKİLİ EVREN</h1>
            <input type="text" id="room-input" placeholder="Oda Adı" style="margin-bottom:10px;">
            <select id="role-select" style="margin-bottom:10px;">
                <option value="gm1">GM (Yönetici)</option>
                <option value="player1">Oyuncu 1</option>
                <option value="player2">Oyuncu 2</option>
                <option value="player3">Oyuncu 3</option>
                <option value="player4">Oyuncu 4</option>
                <option value="player5">Oyuncu 5</option>
            </select>
            <input type="password" id="password-input" placeholder="Şifre" style="margin-bottom:15px;">
            <button onclick="attemptLogin()" style="width:100%; padding:12px;">BAĞLAN</button>
            <p id="login-msg" style="color:var(--accent-red); margin-top:10px; font-size:0.8rem;"></p>
        </div>
    </div>

    <!-- LAYERS -->
    <div id="weather-overlay"></div>
    <div id="ruler-info" style="position:fixed; top:80px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.8); border:1px solid var(--gold-text); padding:5px 15px; border-radius:20px; display:none; z-index:2000; pointer-events:none; color:var(--gold-text);">0m</div>
    
    <!-- 3D DICE ANIMATION CONTAINER -->
    <div id="dice-anim-container" class="dice-container">
        <div class="cube"><div class="face front">?</div><div class="face back">?</div><div class="face right">?</div><div class="face left">?</div><div class="face top">?</div><div class="face bottom">?</div></div>
    </div>

    <!-- DOCK -->
    <div id="ui-dock">
        <button class="dock-btn" onclick="toggleSidebar()" title="Ayarlar">⚙️</button>
        <button class="dock-btn" onclick="togglePanel('panel-initiative')" title="Sıra">⚔️</button>
        <button class="dock-btn" onclick="toggleVoice()" id="btn-voice" title="Sesli Sohbet">📞</button>
        <button class="dock-btn" onclick="togglePanel('panel-music')" title="Müzik">🎵</button>
        <button class="dock-btn" onclick="togglePanel('panel-wiki')" title="Ansiklopedi">📖</button>
        <button class="dock-btn" onclick="togglePanel('panel-dice')" title="Zar At">🎲</button>
        <button class="dock-btn" id="btn-ruler" onclick="toggleRuler()" title="Cetvel">📏</button>
        <button class="dock-btn" onclick="togglePanel('panel-album')" title="Albüm">🖼️</button>
        <button class="dock-btn" onclick="togglePanel('panel-chat')" title="Sohbet">💬</button>
    </div>

    <!-- SIDEBAR -->
    <div id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--glass-border); padding-bottom:10px;">
            <h3 id="user-display" style="color:var(--gold-text);">USER</h3> <button onclick="toggleSidebar()" style="background:none; border:none; color:white; font-size:1.2rem;">✕</button>
        </div>
        <div class="control-group gm-only">
            <span>HARİTA (URL)</span> <div style="display:flex; gap:5px;"><input type="text" id="map-url"><button onclick="setMapURL()" style="width:auto;">YÜKLE</button></div>
            <div style="margin-top:10px; display:flex; gap:5px; align-items:center;">
                <span>GRID:</span> <input type="number" id="grid-size" value="50" onchange="updateGrid()" placeholder="px"> <input type="number" id="grid-scale" value="1.5" step="0.5" onchange="updateGrid()" placeholder="m"> <input type="checkbox" id="grid-show" onchange="updateGrid()" checked style="width:auto;">
            </div>
        </div>
        <div class="control-group"><span>TOKEN EKLE</span> <textarea id="token-url-area" rows="2" placeholder="URL'ler..."></textarea><button onclick="addTokenBulk()" style="width:100%; margin-top:5px;">EKLE</button></div>
        <div class="control-group gm-only">
            <select id="weather-select" onchange="changeWeather()" style="margin-bottom:5px;"><option value="">Açık</option><option value="weather-rain">Yağmur</option><option value="weather-snow">Kar</option><option value="weather-fog">Sis</option></select>
            <button onclick="resetAll()" style="width:100%; background:var(--accent-red);">SIFIRLA</button>
        </div>
    </div>

    <!-- PANELLER -->
    <div id="panel-initiative" class="glass-panel float-panel"><div class="float-header">TUR SIRASI <span id="round-display">T:1</span></div><div id="init-list" class="list-container"></div><div class="gm-only"><input type="text" id="init-name" placeholder="İsim"><input type="number" id="init-val" placeholder="Init"><button onclick="addToInit()">EKLE</button><button onclick="nextTurn()">İLERİ</button><button onclick="clearInit()">SİL</button></div></div>
    
    <div id="panel-music" class="glass-panel float-panel">
        <div class="float-header">MÜZİK ÇALAR <button onclick="togglePanel('panel-music')">X</button></div>
        <div style="padding:10px; text-align:center;">
            <div id="music-status" style="color:var(--gold-text); font-size:0.8rem; margin-bottom:5px;">Durduruldu</div>
            <div class="gm-only">
                <input type="text" id="music-url" placeholder="Youtube / MP3 Linki" style="margin-bottom:5px;">
                <div style="display:flex; gap:5px;">
                    <button onclick="playMusicInput()" style="flex:1;">ÇAL</button>
                    <button onclick="stopMusic()" style="flex:1; background:var(--accent-red);">DUR</button>
                </div>
                <label style="font-size:0.8rem; display:block; margin-top:5px;"><input type="checkbox" id="music-loop" style="width:auto;"> Döngü</label>
                <input type="range" id="music-vol" min="0" max="100" value="50" onchange="setVolume(this.value)">
            </div>
        </div>
    </div>

    <div id="panel-wiki" class="glass-panel float-panel">
        <div class="float-header">BİLGİ BANKASI <button onclick="togglePanel('panel-wiki')">X</button></div>
        <div class="wiki-layout">
            <div class="wiki-list" id="wiki-page-list"></div>
            <div style="display:flex; flex-direction:column;">
                <div id="wiki-view" class="wiki-content"></div>
                <div class="gm-only" id="wiki-edit-area" style="display:none; border-top:1px solid #444; padding-top:5px;">
                    <input type="text" id="wiki-title-edit" placeholder="Başlık">
                    <textarea id="wiki-content-edit" rows="5" placeholder="İçerik (Resim URL yapıştırın)"></textarea>
                    <input type="text" id="wiki-music-edit" placeholder="Sayfa Müziği URL (Opsiyonel)">
                    <button onclick="saveWikiPage()">KAYDET</button>
                </div>
                <div class="gm-only" style="margin-top:auto; padding:5px;">
                    <button onclick="newWikiPage()">YENİ SAYFA</button> <button onclick="editCurrentWiki()">DÜZENLE</button> <button onclick="deleteWiki()" style="background:var(--accent-red)">SİL</button>
                </div>
            </div>
        </div>
    </div>

    <div id="panel-dice" class="float-panel visible" style="pointer-events:none;"> <!-- Always visible buttons -->
        <button onclick="manualRoll(4)" style="pointer-events:auto;">d4</button>
        <button onclick="manualRoll(6)" style="pointer-events:auto;">d6</button>
        <button onclick="manualRoll(8)" style="pointer-events:auto;">d8</button>
        <button onclick="manualRoll(10)" style="pointer-events:auto;">d10</button>
        <button onclick="manualRoll(12)" style="pointer-events:auto;">d12</button>
        <button onclick="manualRoll(20)" style="pointer-events:auto; color:var(--accent-red);">d20</button>
    </div>

    <div id="panel-log" class="glass-panel float-panel visible"><div class="float-header">GÜNLÜK <button onclick="clearLog()">X</button></div><div id="log-content" class="list-container"></div></div>
    <div id="panel-album" class="glass-panel float-panel"><div class="float-header">ALBÜM <button onclick="togglePanel('panel-album')">X</button></div><div id="album-grid" class="album-grid list-container"></div></div>
    
    <div id="panel-chat" class="glass-panel float-panel">
        <div class="float-header">SOHBET</div>
        <div id="chat-content" class="list-container" style="background:rgba(0,0,0,0.3); padding:5px;"></div>
        <div style="margin-top:5px; display:flex; gap:2px;"><input type="text" id="chat-input" placeholder="Mesaj..." onkeypress="if(event.key==='Enter') sendChat()"><button onclick="sendChat()">></button></div>
        <button onclick="sendGif()" style="width:100%; font-size:0.7rem; margin-top:2px; background:#333;">GIF</button>
    </div>

    <!-- OYUN ALANI -->
    <div id="game-area">
        <div id="map-container">
            <img id="game-map" src="" draggable="false">
            <canvas id="grid-canvas"></canvas>
            <canvas id="fog-canvas"></canvas>
            <canvas id="ruler-canvas"></canvas>
        </div>
    </div>

    <!-- CONTEXT MENU (SAĞ TIK) -->
    <div id="context-menu">
        <button onclick="ctxHideToken()" class="gm-only">Gizle / Göster</button>
        <button onclick="ctxLinkToken()">Bağla (Sonraki Tık)</button>
        <button onclick="ctxCopyToken()" class="gm-only">Kopyala</button>
        <button onclick="ctxDeleteToken()" class="gm-only" style="color:var(--accent-red)">Sil</button>
    </div>

    <!-- KARAKTER KAĞIDI -->
    <div id="char-sheet-modal" class="glass-panel">
        <div style="padding:15px; border-bottom:1px solid #444; display:flex; justify-content:space-between;">
            <h2 id="sheet-name" style="margin:0; color:var(--gold-text);"></h2>
            <div><button id="btn-lock" onclick="toggleLock()">KİLİTLE</button> <button onclick="closeSheet()">X</button></div>
        </div>
        <div class="sheet-body">
            <div>
                <input type="text" id="sheet-token-name" onchange="saveSheetMeta()" style="margin-bottom:5px;">
                <div style="display:flex; gap:5px; margin-bottom:5px;">
                    <span style="font-size:0.7rem;">Boyut:</span> <input type="range" id="sheet-token-scale" min="0.5" max="5" step="0.1" onchange="saveSheetMeta()">
                </div>
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <button onclick="duplicateToken()" class="gm-only" style="flex:1; font-size:0.6rem;">ÇOĞALT</button>
                    <button onclick="detachAll()" style="flex:1; font-size:0.6rem; background:var(--accent-red);">BAĞLARI ÇÖZ</button>
                </div>
                <h4 style="border-bottom:1px solid #444;">NİTELİKLER</h4> <div id="attr-list"></div>
                <h4 style="border-bottom:1px solid #444; margin-top:10px;">BECERİLER</h4> <div id="skill-list"></div>
            </div>
            <div>
                <select id="sheet-align" onchange="saveSheetMeta()"><option value="">Yönelim...</option><option>Kuralcı İyi</option><option>Nötr İyi</option><option>Kaotik İyi</option><option>Kuralcı Nötr</option><option>Tam Nötr</option><option>Kaotik Nötr</option><option>Kuralcı Kötü</option><option>Nötr Kötü</option><option>Kaotik Kötü</option></select>
                <select class="trait-select" onchange="saveSheetMeta()"></select> <select class="trait-select" onchange="saveSheetMeta()"></select> <select class="trait-select" onchange="saveSheetMeta()"></select>
                
                <div class="gm-section gm-only" style="margin-top:10px; border:1px solid var(--accent-red); padding:5px;">
                    <label style="color:var(--accent-red);">GM</label>
                    <div style="display:flex; gap:2px;"><input type="number" id="gm-vision" placeholder="Görüş" onchange="gmUpdateToken()"><button onclick="gmTogglePosLock()" id="btn-gm-pos">KİLİT</button></div>
                    <div id="status-grid" style="display:grid; grid-template-columns:repeat(3,1fr); gap:2px; margin-top:5px;"></div>
                </div>
            </div>
        </div>
        <div style="padding:15px; text-align:center; border-top:1px solid #444;">
            <div id="sheet-status" style="margin-bottom:5px; color:#aaa;">...</div>

        // --- GİRİŞ ---
        async function attemptLogin() {
            const room = document.getElementById('room-input').value.trim();
            const role = document.getElementById('role-select').value;
            const pass = document.getElementById('password-input').value;
            if(!room) return alert("Oda adı girin.");
            document.getElementById('loading-overlay').style.display='flex';
            
            try {
                const ref = db.collection('rooms').doc(room);
                const doc = await ref.get();
                if(!doc.exists) {
                    if(pass !== CREDENTIALS[role]) throw new Error("Yeni oda için şifre varsayılan olmalı.");
                    await ref.set({ users:CREDENTIALS, mapSrc:null, grid:{show:true,size:50,scale:1.5}, weather:"", initiative:{list:[],round:1,currentIdx:0}, chat:[], tokens:[], tokenLibrary:[], wiki:[], music:{url:"",playing:false,loop:false,vol:50,type:""}, voice:false });
                } else if(doc.data().users[role] !== pass) throw new Error("Hatalı Şifre");
                
                currentRoom=room; currentUser=role; isGM=role.startsWith('gm');
                document.getElementById('login-screen').style.display='none';
                document.getElementById('user-display').innerText=role.toUpperCase();
                if(isGM) document.querySelectorAll('.gm-only').forEach(e=>e.style.display='block');
                
                // Init Traits
                const opts = `<option value="">Özellik...</option>` + TRAITS.map(t=>`<option>${t}</option>`).join('');
                document.querySelectorAll('.trait-select').forEach(s=>s.innerHTML=opts);

                ref.onSnapshot(snap => { if(snap.exists) { 
                    const oldMusic = gameState.music;
                    gameState=snap.data(); 
                    renderAll(); 
                    handleMusicSync(oldMusic, gameState.music);
                    handleVoiceSync();
                }});
                
                initZoomPan();
                // YT API Init
                if(!window.YT) { var tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; var firstScriptTag = document.getElementsByTagName('script')[0]; firstScriptTag.parentNode.insertBefore(tag, firstScriptTag); }

            } catch(e) { alert(e.message); } finally { document.getElementById('loading-overlay').style.display='none'; }
        }
        function updateState() { if(currentRoom) db.collection('rooms').doc(currentRoom).update(gameState).catch(console.error); }

        // --- MAP & TOKEN ---
        function renderMap() {
            const m = document.getElementById('game-map');
            if(gameState.mapSrc && m.src!==gameState.mapSrc) { m.src=gameState.mapSrc; m.onload=()=>{resizeCvs();drawGrid();drawFog();}; m.style.display='block'; }
            else if(!gameState.mapSrc) { m.style.display='none'; clearCvs(); }
            else { drawGrid(); drawFog(); }

            const mc = document.getElementById('map-container');
            document.querySelectorAll('.token').forEach(e=>e.remove());
            gameState.tokens.forEach(t=>{
                // Hide check
                if(t.hidden && !isGM) return;

                const size=70*(t.scale||1);
                const el=document.createElement('div'); el.className='token';
                el.style.width=size+'px'; el.style.height=size+'px';
                el.style.left=t.x+'px'; el.style.top=t.y+'px';
                el.style.backgroundImage=`url(${t.imgSrc})`;
                
                if(t.hidden && isGM) el.classList.add('hidden-gm');
                
                const isOwn = t.owner===currentUser || isGM;
                let vis=isGM;
                if(!vis) { const mines=gameState.tokens.filter(x=>x.owner===currentUser); for(let m of mines) { const rad=((m.vision||10)/gameState.grid.scale)*gameState.grid.size; if(Math.hypot(t.x-m.x,t.y-m.y)<rad) vis=true; } }
                if(!vis) el.classList.add('hidden-in-fog');

                if(isOwn) {
                    el.classList.add('my-token');
                    if(t.locked && !isGM) el.classList.add('locked-token'); else addDrag(el,t.id);
                    const g=document.createElement('div'); g.className='token-gear'; g.innerHTML='⚙️';
                    g.onclick=e=>{e.stopPropagation(); openSheet(t.id);}
                    g.onmousedown=e=>e.stopPropagation(); g.ontouchstart=e=>e.stopPropagation();
                    el.appendChild(g);
                } else el.classList.add('other-token');

                // Name & Status
                const n=document.createElement('div'); n.className='token-name'; n.innerText=(t.name||t.owner).toUpperCase(); el.appendChild(n);
                if(t.statuses?.length>0) {
                    if(t.statuses.includes("Öldü")) el.classList.add('is-dead');
                    const sb=document.createElement('div'); sb.className='token-statuses';
                    t.statuses.forEach(s=>{if(s!=="Öldü")sb.innerHTML+=`<span class="status-badge">${s}</span>`}); el.appendChild(sb);
                }
                
                // Tooltip
                if(showTooltips) {
                    const tip=document.createElement('div'); tip.className='token-tooltip';
                    const hp=t.stats['Constitution']?t.stats['Constitution'].split(',')[0]*2+10:10;
                    const traits=t.meta?.traits?t.meta.traits.filter(x=>x).join(', '):'-';
                    tip.innerHTML=`<div class="tt-header">${(t.name||"Adsız")}</div><div class="tt-row"><span>HP:</span> <b>~${hp}</b></div><div class="tt-row"><span>Yön:</span> <span>${t.meta?.align||"-"}</span></div><div class="tt-row"><span>Kişilik:</span> <span style="font-size:0.65rem">${traits}</span></div>`;
                    el.appendChild(tip);
                }

                // Click / Context
                el.addEventListener('click', (e) => { 
                    if(linkingMode) { linkToken(t.id); }
                    else activeTokenId = t.id; 
                });
                el.addEventListener('contextmenu', (e) => {
                    e.preventDefault(); ctxTokenId = t.id;
                    const m=document.getElementById('context-menu');
                    m.style.display='flex'; m.style.left=e.clientX+'px'; m.style.top=e.clientY+'px';

                mc.appendChild(el);

        // --- CONTEXT MENU ACTIONS ---
        window.addEventListener('click', ()=>document.getElementById('context-menu').style.display='none');

        function ctxLinkToken() { linkingMode=true; linkParentId=ctxTokenId; alert("Şimdi bağlanacak tokena tıklayın."); }
        function linkToken(childId) {
            if(childId === linkParentId) { linkingMode=false; return; }
            const t=gameState.tokens.find(x=>x.id===childId);
            t.attachTo = linkParentId;
            linkingMode=false; updateState(); alert("Bağlandı.");
        }
        function ctxCopyToken() { /* ...logic... */ }
        function ctxDeleteToken() { if(isGM && confirm("Sil?")) { gameState.tokens=gameState.tokens.filter(x=>x.id!==ctxTokenId); updateState(); } }

        // --- MUSIC PLAYER ---
        function onYouTubeIframeAPIReady() { ytPlayer = new YT.Player('yt-player-container', { height: '0', width: '0', events: { 'onStateChange': onPlayerStateChange } }); }
        function onPlayerStateChange(event) { if (event.data == YT.PlayerState.ENDED && gameState.music.loop) { ytPlayer.playVideo(); } }
        
        function handleMusicSync(oldM, newM) {
            if(JSON.stringify(oldM) === JSON.stringify(newM)) return;
            const status = document.getElementById('music-status');
            status.innerText = newM.playing ? "Çalıyor: " + (newM.type) : "Durduruldu";
            
            if(newM.type === 'yt' && ytPlayer && ytPlayer.loadVideoById) {
                if(newM.url !== oldM.url) ytPlayer.loadVideoById(newM.url);
                if(newM.playing) { ytPlayer.setVolume(newM.vol); ytPlayer.playVideo(); } else ytPlayer.pauseVideo();
            } else if(newM.type === 'mp3') {
                if(newM.url !== oldM.url) audioPlayer.src = newM.url;
                audioPlayer.volume = newM.vol/100;
                audioPlayer.loop = newM.loop;
                if(newM.playing) audioPlayer.play().catch(e=>console.log("Autoplay blocked")); else audioPlayer.pause();
            }
        }
        function playMusicInput() {
            const url = document.getElementById('music-url').value;
            const loop = document.getElementById('music-loop').checked;
            const vol = document.getElementById('music-vol').value;
            let type = "", cleanUrl = url;
            
            if(url.includes('youtube') || url.includes('youtu.be')) {
                type = 'yt';
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                cleanUrl = (match && match[2].length == 11) ? match[2] : null;
            } else { type = 'mp3'; }

            if(cleanUrl) { gameState.music = {url:cleanUrl, playing:true, loop, vol, type}; updateState(); }
        }
        function stopMusic() { gameState.music.playing = false; updateState(); }
        function setVolume(v) { gameState.music.vol = v; updateState(); }

        // --- VOICE CHAT ---
        function toggleVoice() { 
            if(!isGM) return alert("Sadece GM açıp kapatabilir.");
            gameState.voice = !gameState.voice; updateState(); 
        }
        function handleVoiceSync() {
            const btn = document.getElementById('btn-voice');
            if(gameState.voice) {
                btn.classList.add('active-mode');
                if(!jitsiApi) {
                    const domain = "meet.jit.si";
                    const options = {
                        roomName: "ikilievren_vtt_" + currentRoom,
                        width: 1, height: 1,
                        parentNode: document.querySelector('#voice-chat-frame'),
                        configOverwrite: { startWithAudioMuted: true, startWithVideoMuted: true },
                        interfaceConfigOverwrite: { TOOLBAR_BUTTONS: ['microphone'] }

                    jitsiApi = new JitsiMeetExternalAPI(domain, options);
                }
            } else {
                btn.classList.remove('active-mode');
                if(jitsiApi) { jitsiApi.dispose(); jitsiApi = null; }
            }
        }

        // --- WIKI ---
        let currentWikiId = null;
        function renderWikiList() {
            const l = document.getElementById('wiki-page-list'); l.innerHTML="";
            gameState.wiki.forEach(p => {
                const b = document.createElement('button'); b.className=`wiki-btn ${p.id===currentWikiId?'active':''}`;
                b.innerText = p.title;
                b.onclick = () => loadWikiPage(p.id);
                l.appendChild(b);
            });
        }
        function loadWikiPage(id) {
            currentWikiId = id;
            const p = gameState.wiki.find(x=>x.id===id);
            const v = document.getElementById('wiki-view');
            // Parse Images: [url] -> img
            let html = p.content.replace(/(https?:\/\/.*\.(?:png|jpg|jpeg|gif))/i, '<img src="$1">');
            html = html.replace(/\n/g, '<br>');
            v.innerHTML = `<h2>${p.title}</h2><p>${html}</p>`;

                document.getElementById('music-url').value = p.music; playMusicInput();
            }
            renderWikiList();
        }

        function saveWikiPage() {
            if(!isGM || !currentWikiId) return;
            const p = gameState.wiki.find(x=>x.id===currentWikiId);
            p.title = document.getElementById('wiki-title-edit').value;
            p.content = document.getElementById('wiki-content-edit').value;
            p.music = document.getElementById('wiki-music-edit').value;
            document.getElementById('wiki-edit-area').style.display='none';
            updateState(); loadWikiPage(currentWikiId);
        }
        function editCurrentWiki() {
            if(!isGM || !currentWikiId) return;
            const p = gameState.wiki.find(x=>x.id===currentWikiId);
            document.getElementById('wiki-title-edit').value = p.title;
            document.getElementById('wiki-content-edit').value = p.content;
            document.getElementById('wiki-music-edit').value = p.music;
            document.getElementById('wiki-edit-area').style.display='block';
        }

        // --- 3D DICE (Visual Only) ---
        function manualRoll(sides) {
            const res = Math.floor(Math.random()*sides)+1;
            const con = document.getElementById('dice-anim-container');
            const cube = con.querySelector('.cube');
            con.style.display='block';
            
            // Reset Animation
            cube.style.animation = 'none';
            cube.offsetHeight; /* trigger reflow */
            cube.style.animation = null; 
            
            // Show result after anim
            setTimeout(() => {
                con.style.display='none';
                const msg = `<div style="border:1px solid var(--gold-text); padding:5px; text-align:center;"><b>d${sides} ZAR:</b> <span style="font-size:1.5rem; color:var(--accent-red);">${res}</span></div>`;
                addLog(msg); gameState.chat.push({u:"SİSTEM", t:msg, type:'html'}); updateState();
            }, 1500);
        }

        // --- DRAG (Linked Tokens) ---
        function addDrag(el, id) {
            let start=null, initPos=null;
            const startD=(x,y)=>{if(rulerMode)return false;start={x,y};initPos={left:parseInt(el.style.left||0),top:parseInt(el.style.top||0)};return true;}
            const moveD=(x,y)=>{if(!start)return;let nx=initPos.left+(x-start.x)/mapTransform.scale, ny=initPos.top+(y-start.y)/mapTransform.scale; el.style.left=nx+'px'; el.style.top=ny+'px';}
            const endD=(x,y)=>{
                if(!start)return; 
                let dx = (x-start.x)/mapTransform.scale; let dy = (y-start.y)/mapTransform.scale; start=null;
                const t=gameState.tokens.find(x=>x.id===id);
                if(t){ 
                    t.x += dx; t.y += dy;
                    // Move Attached
                    gameState.tokens.filter(tk => tk.attachTo === t.id).forEach(r => { r.x += dx; r.y += dy; });
                    updateState(); 
                }
            }
            el.onmousedown=e=>{if(e.button===0&&startD(e.clientX,e.clientY)){const mm=ev=>moveD(ev.clientX,ev.clientY);const mu=ev=>{endD(ev.clientX,ev.clientY);window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',mu)};window.addEventListener('mousemove',mm);window.addEventListener('mouseup',mu)}};
            el.ontouchstart=e=>{startD(e.touches[0].clientX,e.touches[0].clientY)}; el.ontouchmove=e=>{if(start){e.preventDefault();moveD(e.touches[0].clientX,e.touches[0].clientY)}}; el.ontouchend=e=>{endD(e.changedTouches[0].clientX,e.changedTouches[0].clientY)};
        }
        function detachAll() { const t=gameState.tokens.find(x=>x.id===activeTokenId); if(t) { gameState.tokens.forEach(tk=>{if(tk.attachTo===t.id)tk.attachTo=null}); alert("Tüm bağlar çözüldü."); updateState(); } }

        // --- HELPER WRAPPERS ---
        function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}
        function togglePanel(id){document.getElementById(id).classList.toggle('visible'); if(id==='panel-wiki')renderWikiList();}
        function toggleTooltips(){showTooltips=document.getElementById('show-tooltips').checked; renderMap();}
        function addLog(h){const c=document.getElementById('log-content'); const d=document.createElement('div'); d.className='log-entry'; d.innerHTML=h; c.prepend(d);}
        function clearLog(){document.getElementById('log-content').innerHTML=""}
        function resizeCvs(){const i=document.getElementById('game-map'),w=i.naturalWidth||800,h=i.naturalHeight||600;['grid-canvas','fog-canvas','ruler-canvas'].forEach(id=>{const c=document.getElementById(id);c.width=w;c.height=h})}
        function clearCvs(){['grid-canvas','fog-canvas'].forEach(id=>document.getElementById(id).getContext('2d').clearRect(0,0,9999,9999))}
        function drawGrid(){const c=document.getElementById('grid-canvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!gameState.grid.show)return;x.beginPath();x.strokeStyle='rgba(255,255,255,0.1)';for(let i=0;i<=c.width;i+=gameState.grid.size){x.moveTo(i,0);x.lineTo(i,c.height)}for(let j=0;j<=c.height;j+=gameState.grid.size){x.moveTo(0,j);x.lineTo(c.width,j)}x.stroke()}
        function drawFog(){const c=document.getElementById('fog-canvas'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.fillStyle='black';x.globalAlpha=isGM?0.4:1.0;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-out';x.globalAlpha=1.0;gameState.tokens.filter(t=>isGM||t.owner===currentUser).forEach(t=>{const cx=t.x+35*(t.scale||1),cy=t.y+35*(t.scale||1),rad=((t.vision||10)/gameState.grid.scale)*gameState.grid.size;const g=x.createRadialGradient(cx,cy,rad*0.5,cx,cy,rad);g.addColorStop(0,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');x.beginPath();x.arc(cx,cy,rad,0,Math.PI*2);x.fillStyle=g;x.fill()});x.globalCompositeOperation='source-over'}
        function updateGrid(){if(!isGM)return;gameState.grid.size=parseInt(document.getElementById('grid-size').value)||50;gameState.grid.scale=parseFloat(document.getElementById('grid-scale').value)||1.5;gameState.grid.show=document.getElementById('grid-show').checked;updateState();}
        function changeWeather(){gameState.weather=document.getElementById('weather-select').value;updateState();}
        function applyWeather(){document.getElementById('weather-overlay').className=gameState.weather;if(isGM)document.getElementById('weather-select').value=gameState.weather;}
        function setMapURL() { const u=document.getElementById('map-url').value; if(u){ gameState.mapSrc=u; updateState(); } }
        function addTokenBulk() { const txt = document.getElementById('token-url-area').value; const urls = txt.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s); urls.forEach(u => { if(!gameState.tokenLibrary.includes(u)) gameState.tokenLibrary.push(u); gameState.tokens.push({ id: Date.now()+Math.random(), owner: currentUser, x:100, y:100, imgSrc: u, scale:1, stats:{}, meta:{align:"",traits:['','','']}, vision:10, locked:false, statuses:[], attachTo:null }); }); document.getElementById('token-url-area').value = ""; updateState(); }
        function renderAlbum() { const g = document.getElementById('album-grid'); g.innerHTML = ""; if(!gameState.tokenLibrary) return; gameState.tokenLibrary.forEach(url => { const item = document.createElement('div'); item.className = 'album-item'; item.style.backgroundImage = `url(${url})`; item.onclick = () => { gameState.tokens.push({ id: Date.now(), owner: currentUser, x:100, y:100, imgSrc: url, scale:1, stats:{}, meta:{align:"",traits:['','','']}, vision:10, locked:false, statuses:[], attachTo:null }); updateState(); }; if(isGM) { const del = document.createElement('button'); del.innerText = "X"; del.onclick = (e) => { e.stopPropagation(); gameState.tokenLibrary = gameState.tokenLibrary.filter(u=>u!==url); updateState(); }; item.appendChild(del); } g.appendChild(item); }); }
        
        function renderAll() { renderMap(); renderInit(); renderAct(); renderInsp(); renderChat(); renderAlbum(); applyWeather(); if(document.getElementById('panel-wiki').classList.contains('visible')) renderWikiList(); if(!isGM){ document.getElementById('grid-size').value=gameState.grid.size; document.getElementById('grid-scale').value=gameState.grid.scale; } }

        // --- ZAR LOGIC ---
        function rollStats(){if(!selAttr&&!selSkill)return;const t=gameState.tokens.find(x=>x.id===activeTokenId);let b=0,a=0;if(selAttr){const s=getS(t,selAttr);b+=s.b;a+=s.a}if(selSkill){const s=getS(t,selSkill);b+=s.b;a+=s.a}let res=rollD(b);let total=res.h+a; const msg=`<div style="border-left:3px solid var(--accent-green);padding-left:5px"><b>${(t.name||t.owner).toUpperCase()}</b><br>Zar: [${res.d}]<br>Sonuç: <b style="color:var(--gold-text)">${total} BAŞARI</b></div>`; addLog(msg); gameState.chat.push({u:"SİSTEM",t:msg,type:'html'}); updateState();}
        function rollD(n){let h=0,d=[];for(let i=0;i<n;i++){let r=Math.floor(Math.random()*6)+1;d.push(r);if(r===6)h++}return{h,d}}
        function getS(t,k){const v=t.stats[k]||"1,0";const p=v.split(',');return{b:parseInt(p[0])||1,a:parseInt(p[1])||0}}
        function setS(t,k,b,a){t.stats[k]=`${b},${a}`}
        function openSheet(id) { activeTokenId=id; const t=gameState.tokens.find(x=>x.id===id); if(!t.stats)t.stats={}; if(!t.meta)t.meta={align:"", traits:['','','']}; if(!t.statuses)t.statuses=[]; document.getElementById('char-sheet-modal').style.display='flex'; document.getElementById('sheet-name').innerText=(t.name||t.owner).toUpperCase(); document.getElementById('sheet-token-name').value=t.name||""; document.getElementById('sheet-token-scale').value=t.scale||1; document.getElementById('sheet-align').value=t.meta.align||""; const ts=document.querySelectorAll('.trait-select'); ts.forEach((s,i)=>s.value=t.meta.traits[i]||""); if(isGM){document.getElementById('gm-vision').value=t.vision||10;document.getElementById('btn-gm-pos').style.background=t.locked?"var(--accent-red)":"#333";renderStatusGrid(t);} sheetLocked=false; toggleLock(); toggleLock(); renderStats(t); }
        function closeSheet(){document.getElementById('char-sheet-modal').style.display='none';updateState()}
        function saveSheetMeta(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.name=document.getElementById('sheet-token-name').value;t.scale=parseFloat(document.getElementById('sheet-token-scale').value);t.meta.align=document.getElementById('sheet-align').value;const ts=document.querySelectorAll('.trait-select');t.meta.traits=[ts[0].value,ts[1].value,ts[2].value];updateState()}
        function renderStatusGrid(t){const g=document.getElementById('status-grid');g.innerHTML="";CONDITIONS.forEach(c=>{const a=t.statuses.includes(c);const b=document.createElement('button');b.className=`status-btn ${a?'active-status':''}`;b.innerText=c;b.onclick=()=>{if(a)t.statuses=t.statuses.filter(x=>x!==c);else t.statuses.push(c);renderStatusGrid(t);updateState()};g.appendChild(b)})}
        function gmDeleteToken(){if(confirm("Sil?")){gameState.tokens=gameState.tokens.filter(x=>x.id!==activeTokenId);closeSheet();updateState()}}
        function gmTogglePosLock(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.locked=!t.locked;openSheet(activeTokenId);updateState()}
        function gmUpdateToken(){const t=gameState.tokens.find(x=>x.id===activeTokenId);t.vision=parseFloat(document.getElementById('gm-vision').value)||10;updateState()}
        function renderStats(t){const al=document.getElementById('attr-list'), sl=document.getElementById('skill-list'); al.innerHTML=""; sl.innerHTML=""; const cr=(k,tr,tp)=>{const s=getS(t,k);return `<div class="stat-row"><span style="color:var(--gold-text);font-size:0.75rem">${tr}</span><div class="input-group"><input type="number" min="1" max="5" value="${s.b}" onchange="upS('${k}',this.value,'${s.a}')"></div><div class="input-group"><input type="number" min="0" value="${s.a}" onchange="upS('${k}','${s.b}',this.value)"></div><button class="stat-btn-locked" onclick="selS('${k}','${tp}',this)">${tr}: ${s.b} + ${s.a}</button></div>`}; for(let k in ATTRS)al.innerHTML+=cr(k,ATTRS[k],'attr'); for(let k in SKILLS)sl.innerHTML+=cr(k,SKILLS[k],'skill');}
        window.upS=function(k,b,a){setS(gameState.tokens.find(x=>x.id===activeTokenId),k,b,a); updateState();}
        window.selS=function(k,tp,btn){if(!sheetLocked)return;if(tp==='attr'){selAttr=(selAttr===k)?null:k;document.querySelectorAll('#attr-list .stat-btn-locked').forEach(b=>b.classList.remove('selected'));if(selAttr)btn.classList.add('selected')}else{selSkill=(selSkill===k)?null:k;document.querySelectorAll('#skill-list .stat-btn-locked').forEach(b=>b.classList.remove('selected'));if(selSkill)btn.classList.add('selected')}document.getElementById('sheet-status').innerText=`Seçim: ${selAttr?ATTRS[selAttr]:'-'} + ${selSkill?SKILLS[selSkill]:'-'}`}
        function toggleLock(){sheetLocked=!sheetLocked;const b=document.querySelector('.sheet-body'),btn=document.getElementById('btn-lock');if(sheetLocked){b.classList.add('locked-mode');btn.innerText="AÇ";renderStats(gameState.tokens.find(x=>x.id===activeTokenId))}else{b.classList.remove('locked-mode');btn.innerText="KİLİTLE";selAttr=null;selSkill=null}}
        
        function duplicateToken(){ const t=gameState.tokens.find(x=>x.id===activeTokenId); if(t){ const n=JSON.parse(JSON.stringify(t)); n.id=Date.now(); n.x+=20; n.y+=20; n.attachTo=null; gameState.tokens.push(n); updateState(); closeSheet(); } }

        function renderInit(){const l=document.getElementById('init-list');l.innerHTML="";gameState.initiative.list.sort((a,b)=>b.val-a.val).forEach((i,idx)=>{l.innerHTML+=`<div class="list-item ${idx===gameState.initiative.currentIdx?'active':''}"><span>${i.val} ${i.name}</span>${isGM?`<button style="font-size:0.6rem;background:var(--accent-red)" onclick="rmInit(${i.id})">X</button>`:''}</div>`})}
        function addToInit(){if(!isGM)return;gameState.initiative.list.push({id:Date.now(),name:document.getElementById('init-name').value,val:parseInt(document.getElementById('init-val').value)||0});updateState();}
        function nextTurn(){if(!isGM)return;gameState.initiative.currentIdx++;if(gameState.initiative.currentIdx>=gameState.initiative.list.length){gameState.initiative.currentIdx=0;gameState.initiative.round++}updateState();}
        function rmInit(id){if(!isGM)return;gameState.initiative.list=gameState.initiative.list.filter(x=>x.id!==id);updateState();}
        function clearInit(){if(!isGM)return;gameState.initiative={list:[],round:1,currentIdx:0};updateState();}
        function renderAct(){const l=document.getElementById('act-list');l.innerHTML="";Object.entries(gameState.activity.scores).sort((a,b)=>b[1]-a[1]).forEach(([u,t])=>{l.innerHTML+=`<div class="list-item"><span>${u.toUpperCase()}</span><span>${Math.floor(t/60)}:${Math.floor(t%60).toString().padStart(2,'0')}</span></div>`})}
        function resetAct(){if(isGM){gameState.activity.scores={};updateState();}}
        function renderInsp(){const l=document.getElementById('insp-list');l.innerHTML="";Object.entries(gameState.inspiration).forEach(([u,v])=>{if(v>0)l.innerHTML+=`<div class="list-item"><span>${u.toUpperCase()}</span><span style="color:var(--gold-text);font-weight:bold">${v}</span></div>`})}
        function resetInsp(){if(isGM){gameState.inspiration={};updateState();}}
        function resetAll(){if(isGM&&confirm("Emin misin?")){gameState={mapSrc:null,grid:{show:true,size:50,scale:1.5},weather:"",initiative:{list:[],round:1,currentIdx:0},activity:{paused:false,scores:{}},inspiration:{},chat:[],tokens:[],tokenLibrary:[],wiki:[],music:{url:"",playing:false,loop:false,vol:50,type:""},voice:false};updateState();}}
        function sendChat(){const i=document.getElementById('chat-input'),t=i.value.trim();if(!t)return;gameState.chat.push({u:currentUser,t:t,type:'text'});updateState();i.value=""}
        function sendGif(){const u=prompt("GIF Link:");if(u){gameState.chat.push({u:currentUser,t:u,type:'gif'});updateState()}}
        function renderChat(){const c=document.getElementById('chat-content');c.innerHTML=gameState.chat.map(m=>`<div class="chat-msg"><b>${m.u.toUpperCase()}:</b> ${m.type==='gif'?`<img src="${m.t}" class="chat-gif">`:m.t}</div>`).join('');c.scrollTop=c.scrollHeight}

        function initZoomPan(){
            const area=document.getElementById('game-area'), cont=document.getElementById('map-container');
            let isPanning=false, startX=0, startY=0;
            function apply() { cont.style.transform = `translate(${mapTransform.x}px, ${mapTransform.y}px) scale(${mapTransform.scale})`; }
            area.addEventListener('wheel', e => { e.preventDefault(); const delta = e.deltaY>0?0.9:1.1; const newScale = Math.min(Math.max(0.1, mapTransform.scale*delta), 10); const rect=area.getBoundingClientRect(), mx=e.clientX-rect.left, my=e.clientY-rect.top; mapTransform.x = mx - (mx - mapTransform.x)*(newScale/mapTransform.scale); mapTransform.y = my - (my - mapTransform.y)*(newScale/mapTransform.scale); mapTransform.scale = newScale; apply(); }, {passive:false});
            area.addEventListener('contextmenu',e=>e.preventDefault());
            area.addEventListener('mousedown',e=>{if(e.button===2){isPanning=true;startX=e.clientX-mapTransform.x;startY=e.clientY-mapTransform.y;area.style.cursor='grabbing';}});
            window.addEventListener('mousemove',e=>{if(isPanning){e.preventDefault();mapTransform.x=e.clientX-startX;mapTransform.y=e.clientY-startY;apply();}});
            window.addEventListener('mouseup',()=>{isPanning=false;area.style.cursor='default';});
            let initDist=0, initScale=1;
            area.addEventListener('touchstart',e=>{if(e.touches.length===2){initDist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);initScale=mapTransform.scale;}},{passive:false});
            area.addEventListener('touchmove',e=>{if(e.touches.length===2){e.preventDefault();const dist=Math.hypot(e.touches[0].pageX-e.touches[1].pageX,e.touches[0].pageY-e.touches[1].pageY);const delta=dist/initDist;mapTransform.scale=Math.min(Math.max(0.1,initScale*delta),10);apply();}},{passive:false});
        }
        function toggleRuler(){rulerMode=!rulerMode;rulerStartPoint=null;const b=document.getElementById('btn-ruler'),a=document.getElementById('game-area'),c=document.getElementById('ruler-canvas').getContext('2d');if(rulerMode){b.classList.add('active-mode');a.classList.add('ruler-active')}else{b.classList.remove('active-mode');a.classList.remove('ruler-active');c.clearRect(0,0,c.canvas.width,c.canvas.height);document.getElementById('ruler-info').style.display='none'}}
        function getMapPt(e){const r=document.getElementById('map-container').getBoundingClientRect();let cx=e.clientX,cy=e.clientY;if(e.touches&&e.touches[0]){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}return{x:(cx-r.left)/mapTransform.scale,y:(cy-r.top)/mapTransform.scale}}
        const gArea=document.getElementById('game-area');
        gArea.addEventListener('mousedown',e=>{if(!rulerMode||e.button!==0)return;tempStart=getMapPt(e);isDraggingRuler=false});
        window.addEventListener('mousemove',e=>{if(!rulerMode)return;const c=getMapPt(e),ctx=document.getElementById('ruler-canvas').getContext('2d'),o=rulerStartPoint||tempStart;if(!o)return;if(tempStart)isDraggingRuler=true;ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.beginPath();ctx.strokeStyle='#f1c40f';ctx.lineWidth=3/mapTransform.scale;ctx.setLineDash([10,5]);ctx.moveTo(o.x,o.y);ctx.lineTo(c.x,c.y);ctx.stroke();const m=(Math.hypot(c.x-o.x,c.y-o.y)/gameState.grid.size)*gameState.grid.scale;const i=document.getElementById('ruler-info');i.style.display='block';i.innerText=m.toFixed(1)+"m"});
        window.addEventListener('mouseup',e=>{if(!rulerMode)return;const ctx=document.getElementById('ruler-canvas').getContext('2d'); if(tempStart&&isDraggingRuler&&!rulerStartPoint){tempStart=null;ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);document.getElementById('ruler-info').style.display='none'}else if(tempStart&&!isDraggingRuler){if(!rulerStartPoint)rulerStartPoint=tempStart;else{rulerStartPoint=null;ctx.clearRect(0,0,ctx.canvas.width,ctx.canvas.height);document.getElementById('ruler-info').style.display='none'}tempStart=null}});
        gArea.addEventListener('touchstart',e=>{if(rulerMode){tempStart=getMapPt(e);isDraggingRuler=false}});
        gArea.addEventListener('touchend',e=>{if(rulerMode){if(tempStart&&!isDraggingRuler){if(!rulerStartPoint)rulerStartPoint=tempStart;else{rulerStartPoint=null;document.getElementById('ruler-canvas').getContext('2d').clearRect(0,0,9999,9999);}}tempStart=null}});

    </script>
</body>
</html>
