<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZE Zar</title>
    <!-- Owlbear Rodeo'nun asla çökmeyen resmi düz bağlantısı -->
    <script src="https://cdn.owlbear.rodeo/owlbear-rodeo-sdk-v2.js"></script>

    <style>
        body { font-family: sans-serif; background-color: #242424; color: #fff; margin: 0; padding: 15px; }
        h3 { text-align: center; border-bottom: 2px solid #444; padding-bottom: 5px; margin-top: 0; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center;}
        input { width: 50px; text-align: center; font-size: 16px; padding: 5px; border-radius: 5px; border: 1px solid #555; background: #111; color: white;}
        button { width: 100%; padding: 12px; margin-top: 5px; font-weight: bold; font-size: 15px; cursor: pointer; border-radius: 5px; border: none; }
        
        #rollBtn { background: #4CAF50; color: white; }
        #pushBtn { background: #E53935; color: white; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        
        #diceContainer { margin-top: 20px; text-align: center; min-height: 100px; background: #333; padding: 10px; border-radius: 8px;}
        .die { display: inline-flex; width: 40px; height: 40px; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; margin: 5px; border-radius: 6px; color: black; box-shadow: 2px 2px 5px rgba(0,0,0,0.5);}
        
        /* YZE Zar Renkleri */
        .base { background: #fff; } /* Temel (Beyaz) */
        .skill { background: #4CAF50; } /* Yetenek (Yeşil) */
        .gear { background: #aaa; } /* Eşya (Siyah/Gri) */
        
        /* YZE Başarı ve Hasar Parlamaları */
        .success { background: #FFD700; box-shadow: 0 0 10px #FFD700; color: #000; } /* 6 atanlar altın parlar */
        .bane { background: #E53935; color: white; box-shadow: 0 0 10px #E53935; } /* 1 atanlar kırmızı parlar */

        #status { text-align: center; font-size: 12px; color: #aaa; margin-top: 15px; }
    </style>
</head>
<body>

    <h3>YZE Zar Sistemi</h3>

    <div class="row">
        <label>Temel (Beyaz):</label>
        <input type="number" id="b" value="0" min="0">
    </div>
    <div class="row">
        <label>Yetenek (Yeşil):</label>
        <input type="number" id="s" value="0" min="0">
    </div>
    <div class="row">
        <label>Eşya (Siyah):</label>
        <input type="number" id="g" value="0" min="0">
    </div>

    <button id="rollBtn">ZAR AT</button>
    <button id="pushBtn" disabled>ZORLA (PUSH)</button>

    <div id="diceContainer">
        <div style="color:#aaa; font-size: 14px; margin-top: 30px;">Zarlar burada görünecek...</div>
    </div>
    
    <div id="status">Owlbear Rodeo aranıyor...</div>

    <script>
        let rolls = { b: [], s: [], g:[] };
        let hasPushed = false;
        let myName = "Oyuncu";

        // Güvenlik duvarlarına takılmayan standart zar atıcı
        function rollD6() {
            return Math.floor(Math.random() * 6) + 1;
        }

        // Zarları Ekranda Kutu Olarak Çizdirme
        function drawDice() {
            const container = document.getElementById("diceContainer");
            container.innerHTML = "";
            let totalSuccess = 0;

            const createDie = (val, type) => {
                let el = document.createElement("div");
                el.className = "die " + type;
                el.innerText = val;

                // YZE Kuralları
                if (val === 6) {
                    el.classList.add("success");
                    el.innerText = "☢"; // Başarı sembolü
                    totalSuccess++;
                } 
                else if (val === 1 && (type === "base" || type === "gear")) {
                    el.classList.add("bane"); // Sadece temel ve eşyada 1 kötüdür
                }
                container.appendChild(el);
            };

            rolls.b.forEach(v => createDie(v, "base"));
            rolls.s.forEach(v => createDie(v, "skill"));
            rolls.g.forEach(v => createDie(v, "gear"));

            if (rolls.b.length || rolls.s.length || rolls.g.length) {
                let res = document.createElement("div");
                res.style.marginTop = "10px";
                res.style.fontWeight = "bold";
                res.style.color = "#FFD700";
                res.innerText = "TOPLAM BAŞARI: " + totalSuccess;
                container.appendChild(res);
            }
        }

        function countSucc() {
            let s = 0;
            rolls.b.forEach(v => { if(v===6) s++ });
            rolls.s.forEach(v => { if(v===6) s++ });
            rolls.g.forEach(v => { if(v===6) s++ });
            return s;
        }

        // Owlbear'ın YERLEŞİK Pop-up Sistemine Veri Gönderme
        function sendToOwlbear(isPush) {
            let succ = countSucc();
            let msg = `${myName} ${isPush ? 'zarları ZORLADI' : 'zar attı'}! Toplam: ${succ} BAŞARI.\n`;
            if(rolls.b.length) msg += `Temel: [${rolls.b.join(",")}] `;
            if(rolls.s.length) msg += `Yetenek: [${rolls.s.join(",")}] `;
            if(rolls.g.length) msg += `Eşya: [${rolls.g.join(",")}]`;

            try {
                // Diğer oyuncuların ekranına gönder
                OBR.broadcast.sendMessage("yze-roll", msg);
                // Kendi Owlbear ekranınızda pop-up uyarısı çıkar
                OBR.notification.show(msg, succ > 0 ? "SUCCESS" : "DEFAULT");
            } catch(e) {}
        }

        // Zar Atma Tıklaması
        document.getElementById("rollBtn").onclick = () => {
            let b = parseInt(document.getElementById("b").value) || 0;
            let s = parseInt(document.getElementById("s").value) || 0;
            let g = parseInt(document.getElementById("g").value) || 0;

            if(b===0 && s===0 && g===0) return;

            rolls.b = Array.from({length: b}, rollD6);
            rolls.s = Array.from({length: s}, rollD6);
            rolls.g = Array.from({length: g}, rollD6);
            
            hasPushed = false;
            document.getElementById("pushBtn").disabled = false;

            drawDice();
            sendToOwlbear(false);
        };

        // Zorlama (Push) Tıklaması
        document.getElementById("pushBtn").onclick = () => {
            if(hasPushed) return;

            // YZE Zorlama Kuralları: 6'lar ve 1'ler kilitli kalır, gerisi yeniden atılır
            rolls.b = rolls.b.map(v => (v===6 || v===1) ? v : rollD6());
            rolls.s = rolls.s.map(v => (v===6) ? v : rollD6()); // Yetenekteki 1'ler yeniden atılabilir
            rolls.g = rolls.g.map(v => (v===6 || v===1) ? v : rollD6());

            hasPushed = true;
            document.getElementById("pushBtn").disabled = true;

            drawDice();
            sendToOwlbear(true);
        };

        // Owlbear Rodeo Entegrasyonu
        if (typeof OBR !== "undefined") {
            OBR.onReady(async () => {
                document.getElementById("status").innerText = "🟢 Odaya Bağlandı (Tüm özellikler aktif)";
                
                try { myName = await OBR.player.getName() || "Oyuncu"; } 
                catch(e) {}

                // DİĞER OYUNCULAR İÇİN: Arkada gizlice çalışan bu dosya başkasının zar attığını yakalar.
                OBR.broadcast.onMessage("yze-roll", (event) => {
                    let msg = event.data;
                    let isSuccess = msg.includes("BAŞARI") && !msg.includes(" 0 BAŞARI");
                    // Owlbear'ın KENDİ yerleşik Pop-up sistemini kullanarak ekranda göster
                    OBR.notification.show(msg, isSuccess ? "SUCCESS" : "DEFAULT");
                });
            });
        }
    </script>
</body>
</html>
