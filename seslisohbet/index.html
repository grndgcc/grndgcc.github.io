<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YZE Zar</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.owlbear.rodeo/owlbear-rodeo-sdk-v2.js"></script>
</head>
<body>
    <div class="container">
        <h3>Year Zero Engine Zar</h3>
        
        <div class="input-group">
            <label>Temel (Base):</label>
            <input type="number" id="baseDice" min="0" value="0">
        </div>
        <div class="input-group">
            <label>Yetenek (Skill):</label>
            <input type="number" id="skillDice" min="0" value="0">
        </div>
        <div class="input-group">
            <label>Eşya (Gear):</label>
            <input type="number" id="gearDice" min="0" value="0">
        </div>

        <button id="rollBtn">Zar At</button>
        <button id="pushBtn" disabled>Zorla (Push)</button>

        <div id="results">
            <!-- Zar sonuçları buraya gelecek -->
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
