<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>YZE Zar Atıcı</title>
  <style>
    /* Owlbear Rodeo temasına uygun karanlık, şık arayüz */
    :root {
      --bg-color: #24242e;
      --text-color: #f0f0f0;
      --accent: #9c64e8;
      --btn-hover: #bb86fc;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;
    }
    .container {
      text-align: center;
      width: 100%;
      padding: 0 20px;
    }
    h2 { margin: 0 0 15px 0; font-size: 1.3rem; letter-spacing: 1px;}
    .input-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    label { font-size: 0.95rem; color: #ccc; }
    input {
      width: 80px;
      padding: 10px;
      font-size: 1.2rem;
      text-align: center;
      border: 1px solid #444;
      border-radius: 6px;
      background: #181820;
      color: #fff;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background-color: var(--accent);
      color: #fff;
      border: none;
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background-color: var(--btn-hover); }
    #last-roll {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #aaa;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>YZE Zar Atıcı</h2>
    
    <div class="input-group">
      <label for="dice-count">Kaç Adet Zar (d6) Atılacak?</label>
      <input type="number" id="dice-count" value="1" min="1" max="50">
    </div>

    <button id="roll-btn">Zarları Fırlat</button>
    <div id="last-roll"></div>
  </div>

  <script type="module">
    // Gereksiz JS dosyaları yerine Owlbear SDK'sını doğrudan ESM modülü olarak çekiyoruz.
    import OBR from "https://esm.sh/@owlbear-rodeo/sdk@3.0.0";

    const CHANNEL_ID = "com.custom.yze-dice-channel";

    OBR.onReady(async () => {
      // Zar atan oyuncunun adını çekiyoruz
      const playerName = await OBR.player.getName();

      // DİĞER oyunculardan gelen zar bildirimlerini (broadcast) dinleyip onlara popup çıkarıyoruz
      OBR.broadcast.onMessage(CHANNEL_ID, (event) => {
        const { player, rolls, successes, failures } = event.data;
        showNotification(player, rolls, successes, failures);
      });

      // Zarları at butonuna tıklandığında çalışacak olan fonksiyon
      document.getElementById("roll-btn").addEventListener("click", () => {
        const countInput = document.getElementById("dice-count").value;
        const count = parseInt(countInput, 10);
        
        if (isNaN(count) || count < 1) return;

        const rolls =[];
        let successes = 0;
        let failures = 0;

        // Girilen miktar kadar 6'lık zar at ve YZE kurallarını hesapla
        for (let i = 0; i < count; i++) {
          const val = Math.floor(Math.random() * 6) + 1;
          rolls.push(val);
          if (val === 6) successes++;
          if (val === 1) failures++;
        }

        // Sonuç paketini hazırla
        const payload = { player: playerName, rolls, successes, failures };

        // 1. Sonuçları odadaki diğer tüm oyunculara canlı olarak yayınla
        OBR.broadcast.sendMessage(CHANNEL_ID, payload);

        // 2. Kendi ekranında popup çıkar (broadcast atan kişiye geri dönmediği için manuel yapıyoruz)
        showNotification("Sen", rolls, successes, failures);

        // 3. Eklenti popover'ı içerisindeki arayüzü güncelle
        document.getElementById("last-roll").innerHTML = 
          `Zarlar: [${rolls.join(', ')}]<br>✅ Başarım: ${successes} | ❌ Başarısızlık: ${failures}`;
      });

      // Owlbear Rodeo'nun dahili bildirim sistemini kullanarak ekranda Popup çıkaran fonksiyon
      function showNotification(player, rolls, successes, failures) {
        const title = `${player} zar attı!`;
        const details = `Zarlar: [${rolls.join(', ')}] \n✅ Başarım: ${successes} \n❌ Başarısızlık: ${failures}`;
        
        // Owlbear ekranında toast popup gösterme komutu
        OBR.notification.show(title + "\n" + details);
      }
    });
  </script>
</body>
</html>
