<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.owlbear.rodeo/owlbear-rodeo-sdk-v2.js"></script>
    <script>
        OBR.onReady(() => {
            // Başka bir oyuncudan zar mesajı geldiğinde dinle
            OBR.broadcast.onMessage('yze-roll-event', (event) => {
                const data = event.data;
                const variant = data.successes > 0 ? "SUCCESS" : "WARNING";
                // Ekranda pop-up bildirim göster
                OBR.notification.show(data.message, variant);
            });
        });
    </script>
</head>
<body></body>
</html>
